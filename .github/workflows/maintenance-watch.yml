name: PHP maintenance watcher

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: php-maintenance-watcher
  cancel-in-progress: false

jobs:
  investigate:
    name: Capture and investigate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      trigger: ${{ steps.decision.outputs.trigger }}
      action_key: ${{ steps.plan.outputs.action_key }}
      edits_required: ${{ steps.plan.outputs.edits_required }}
      base_sha: ${{ steps.plan.outputs.base_sha }}
      action: ${{ steps.plan.outputs.action }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Capture fixed raw evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          ./maintenance/control.py validate-policy
          ./scripts/capture-maintenance-evidence --output maintenance-run/evidence
      - name: Decide whether an agent call is required
        id: decision
        run: |
          ./scripts/watch-maintenance-evidence \
            --manifest maintenance-run/evidence/evidence-manifest.json \
            --previous maintenance-state/last-evidence.json \
            --events maintenance-events \
            --output maintenance-run/watch-decision.json
          echo "trigger=$(jq -r .trigger maintenance-run/watch-decision.json)" >> "$GITHUB_OUTPUT"
      - name: Record exact preconditions
        if: steps.decision.outputs.trigger != 'quiet'
        run: |
          jq -n \
            --arg phpBinHead "$(git rev-parse HEAD)" \
            --arg misePhpHead "$(jq -r .sha maintenance-run/evidence/raw/mise_php_state.body)" \
            --arg supportPolicyDigest "$(./maintenance/control.py digest support-policy.json)" \
            '{phpBinHead:$phpBinHead,misePhpHead:$misePhpHead,supportPolicyDigest:$supportPolicyDigest}' \
            > maintenance-run/preconditions.json
          [[ "$(jq -r .misePhpHead maintenance-run/preconditions.json)" =~ ^[0-9a-f]{40}$ ]]
          shopt -s nullglob
          event_files=(maintenance-events/*.json)
          if (( ${#event_files[@]} )); then
            jq -s '[.[] | select(.state=="complete") | .actionKey] | sort | unique' \
              "${event_files[@]}" > maintenance-run/completed-actions.json
          else
            printf '[]\n' > maintenance-run/completed-actions.json
          fi
      - name: Prepare investigation contract
        if: steps.decision.outputs.trigger != 'quiet'
        run: |
          ./scripts/prepare-agent-task \
            --phase investigation \
            --action-key "investigate:${{ steps.decision.outputs.trigger }}:${{ github.run_id }}" \
            --goal "Classify the captured maintenance trigger and emit one evidence-bound plan." \
            --preconditions maintenance-run/preconditions.json \
            --allowed-authority read_repository \
            --allowed-authority read_captured_evidence \
            --allowed-authority allowlisted_web_search \
            --non-goal repository_mutation \
            --non-goal irreversible_github_effect \
            --stop-condition missing_or_contradictory_required_evidence \
            --stop-condition changed_precondition \
            --stop-condition required_protected_change \
            --shared .github/codex/maintenance/shared.md \
            --phase-template .github/codex/maintenance/investigation.md \
            --contract-output maintenance-run/event-contract.json \
            --prompt-output maintenance-run/investigation-prompt.md
          mkdir -p "$RUNNER_TEMP/codex-home"
          cp .codex/investigation.config.toml "$RUNNER_TEMP/codex-home/"
      - name: Run read-only Codex investigation
        if: steps.decision.outputs.trigger != 'quiet'
        uses: openai/codex-action@52fe01ec70a42f454c9d2ebd47598f9fd6893d56 # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: maintenance-run/investigation-prompt.md
          output-file: maintenance-run/maintenance-plan.json
          codex-home: ${{ runner.temp }}/codex-home
          sandbox: read-only
          safety-strategy: drop-sudo
          allow-users: loadinglucian
          allow-bots: github-actions[bot]
          codex-args: '["--strict-config","--ephemeral","--profile","investigation","--output-schema","schemas/maintenance-plan.schema.json"]'
      - name: Admit plan against exact evidence
        if: steps.decision.outputs.trigger != 'quiet'
        run: |
          ./scripts/admit-maintenance-plan \
            --plan maintenance-run/maintenance-plan.json \
            --manifest maintenance-run/evidence/evidence-manifest.json \
            --contract maintenance-run/event-contract.json \
            --shared .github/codex/maintenance/shared.md \
            --phase .github/codex/maintenance/investigation.md \
            --event-contract maintenance-run/event-contract.json \
            --php-bin-head "$(git rev-parse HEAD)" \
            --mise-php-head "$(jq -r .misePhpHead maintenance-run/preconditions.json)" \
            --policy-digest "$(./maintenance/control.py digest support-policy.json)" \
            --completed-actions maintenance-run/completed-actions.json \
            --output maintenance-run/admission.json
      - name: Expose admitted plan
        id: plan
        if: steps.decision.outputs.trigger != 'quiet'
        run: |
          echo "action_key=$(jq -r .actionKey maintenance-run/maintenance-plan.json)" >> "$GITHUB_OUTPUT"
          echo "edits_required=$(jq -r .editsRequired maintenance-run/maintenance-plan.json)" >> "$GITHUB_OUTPUT"
          echo "base_sha=$(jq -r .preconditions.phpBinHead maintenance-run/maintenance-plan.json)" >> "$GITHUB_OUTPUT"
          echo "action=$(jq -r .action maintenance-run/maintenance-plan.json)" >> "$GITHUB_OUTPUT"
      - name: Retain evidence and admitted plan
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: maintenance-investigation-${{ github.run_id }}
          path: maintenance-run/
          if-no-files-found: error
          retention-days: 90
          include-hidden-files: true

  coordinate:
    name: Dispatch admitted next phase
    needs: investigate
    if: needs.investigate.outputs.action_key != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Download admitted investigation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${{ github.run_id }}" \
            --repo "${{ github.repository }}" \
            --name "maintenance-investigation-${{ github.run_id }}" \
            --dir maintenance-plan-download
      - name: Dispatch implementation or no-edit release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$(jq -r .unattendedMutation .github/maintenance-operator.json)" != "enabled" ]]; then
            echo "Unattended mutation is paused; retained investigation remains read-only."
            exit 0
          fi
          action="${{ needs.investigate.outputs.action }}"
          if [[ "$action" == "blocked" || "$action" == "needs_human" ]]; then
            jq -n \
              --arg actionKey "${{ needs.investigate.outputs.action_key }}" \
              --arg state "$action" \
              --arg summary "$(jq -r .summary maintenance-plan-download/maintenance-plan.json)" \
              --arg evidenceDigest "$(jq -r .manifestDigest maintenance-plan-download/evidence/evidence-manifest.json)" \
              '{actionKey:$actionKey,state:$state,severity:"warning",humanActionRequired:($state=="needs_human"),summary:$summary,evidenceDigest:$evidenceDigest}' \
              > maintenance-plan-download/notification-event.json
            ./scripts/notify-maintenance \
              --event maintenance-plan-download/notification-event.json \
              --state maintenance-plan-download/notification-state.json \
              --output maintenance-plan-download/notification-next.json \
              --backend github \
              --repo "${{ github.repository }}" \
              --owner "${{ vars.MAINTENANCE_OWNER }}"
            exit 0
          elif [[ "$action" == "new_branch" || "$action" == "branch_eol" ]]; then
            jq -n \
              --arg actionKey "${{ needs.investigate.outputs.action_key }}" \
              --arg summary "$(jq -r .notification.summary maintenance-plan-download/maintenance-plan.json)" \
              --arg evidenceDigest "$(jq -r .manifestDigest maintenance-plan-download/evidence/evidence-manifest.json)" \
              '{actionKey:$actionKey,state:"detected",severity:"info",humanActionRequired:false,summary:$summary,evidenceDigest:$evidenceDigest}' \
              > maintenance-plan-download/lifecycle-notification.json
            ./scripts/notify-maintenance \
              --event maintenance-plan-download/lifecycle-notification.json \
              --state maintenance-plan-download/lifecycle-notification-state.json \
              --output maintenance-plan-download/lifecycle-notification-next.json \
              --backend github \
              --repo "${{ github.repository }}" \
              --owner "${{ vars.MAINTENANCE_OWNER }}"
          fi

          if [[ "$action" == "no_change" ]]; then
            :
            git checkout -B "maintenance/evidence-${{ github.run_id }}" origin/main
            base="$(git rev-parse HEAD)"
            mkdir -p maintenance-state
            jq -n \
              --arg manifestDigest "$(jq -r .manifestDigest maintenance-plan-download/evidence/evidence-manifest.json)" \
              --arg planDigest "$(jq -r .planDigest maintenance-plan-download/admission.json)" \
              --argjson captureDigests "$(jq '[.captures[] | {captureId,digest,status}]' maintenance-plan-download/evidence/evidence-manifest.json)" \
              '{schemaVersion:1,manifestDigest:$manifestDigest,planDigest:$planDigest,captures:$captureDigests}' \
              > maintenance-state/last-evidence.json
            git add maintenance-state/last-evidence.json
            git -c user.name=maintenance-watcher -c user.email=maintenance@invalid \
              commit -m "chore: record reviewed maintenance evidence"
            head="$(git rev-parse HEAD)"
            record_digest="sha256:$(shasum -a 256 maintenance-state/last-evidence.json | awk '{print $1}')"
            gh auth setup-git
            git push origin HEAD
            url="$(gh pr create --base main --head "maintenance/evidence-${{ github.run_id }}" \
              --title "chore: record reviewed maintenance evidence" \
              --body "Opaque evidence state for a reviewed no-change result.")"
            number="${url##*/}"
            gh pr checks "$number" --watch --fail-fast --interval 10
            gh pr checks "$number" --json name,bucket,link > maintenance-plan-download/no-change-checks.json
            jq -e '[.[] | select(.name=="Script checks") | .bucket] == ["pass"]' maintenance-plan-download/no-change-checks.json
            test "$(gh pr view "$number" --json headRefOid --jq .headRefOid)" = "$head"
            git fetch origin main
            test "$(git rev-parse origin/main)" = "$base"
            test "$(git rev-list --parents -n 1 "$head")" = "$head $base"
            test "$(git diff --name-only "$base" "$head")" = "maintenance-state/last-evidence.json"
            test "sha256:$(git show "$head:maintenance-state/last-evidence.json" | shasum -a 256 | awk '{print $1}')" = "$record_digest"
            gh pr merge "$number" --squash --delete-branch
            exit 0
          elif [[ "${{ needs.investigate.outputs.edits_required }}" == "true" ]]; then
            gh workflow run maintenance-implementation.yml \
              --repo "${{ github.repository }}" \
              --ref main \
              -f investigation_run_id="${{ github.run_id }}" \
              -f exact_base_sha="${{ needs.investigate.outputs.base_sha }}" \
              -f phase=implementation
          elif [[ "$action" == "new_patch" || "$action" == "new_branch" || "$action" == "reconcile_partial" ]]; then
            if [[ "$action" == "new_branch" ]]; then
              filename="$(printf '%s' "${{ needs.investigate.outputs.action_key }}" | tr ':/' '--').json"
              if ! gh api "repos/bigpixelrocket/mise-php/contents/readiness/$filename?ref=main" >/dev/null 2>&1; then
                echo "Waiting for exact mise-php readiness for $filename."
                exit 0
              fi
            fi
            version="$(jq -r .releaseIntent.version maintenance-plan-download/maintenance-plan.json)"
            gh workflow run maintenance-release.yml \
              --repo "${{ github.repository }}" \
              --ref main \
              -f action_key="${{ needs.investigate.outputs.action_key }}" \
              -f investigation_run_id="${{ github.run_id }}" \
              -f version="$version" \
              -f exact_commit="${{ needs.investigate.outputs.base_sha }}"
          elif [[ "$action" == "branch_eol" ]]; then
            action_key="${{ needs.investigate.outputs.action_key }}"
            filename="$(printf '%s' "$action_key" | tr ':/' '--').json"
            if ! gh api "repos/bigpixelrocket/mise-php/contents/readiness/$filename?ref=main" \
              --jq .content > maintenance-plan-download/mise-readiness.b64; then
              echo "Waiting for exact mise-php EOL readiness for $filename."
              exit 0
            fi
            base64 --decode < maintenance-plan-download/mise-readiness.b64 \
              > maintenance-plan-download/mise-readiness.json
            event="maintenance-events/$filename"
            test -f "$event"
            test "$(jq -r .actionKey maintenance-plan-download/mise-readiness.json)" = "$action_key"
            test "$(jq -r .ready maintenance-plan-download/mise-readiness.json)" = "true"
            test "$(jq -r .supportPolicyDigest "$event")" = "$(jq -r .policyDigest maintenance-plan-download/mise-readiness.json)"
            test "$(jq -r .policyInvariantsDigest "$event")" = "$(jq -r .policyInvariantsDigest maintenance-plan-download/mise-readiness.json)"
            policy_commit="$(jq -r .phpBinPolicyCommit maintenance-plan-download/mise-readiness.json)"
            gh api "repos/${{ github.repository }}/contents/support-policy.json?ref=$policy_commit" \
              --jq .content | base64 --decode > maintenance-plan-download/readiness-policy.json
            test "sha256:$(shasum -a 256 maintenance-plan-download/readiness-policy.json | awk '{print $1}')" = "$(jq -r .policyDigest maintenance-plan-download/mise-readiness.json)"
            jq -n --slurpfile ready maintenance-plan-download/mise-readiness.json \
              '[{kind:"mise_eol_readiness",record:$ready[0]}]' > maintenance-plan-download/transition-evidence.json
            if [[ "$(jq -r .state "$event")" == "php_bin_ready" ]]; then
              ./scripts/maintenance-event --event "$event" --target mise_ready \
                --evidence maintenance-plan-download/transition-evidence.json --output "$event.next"
              mv "$event.next" "$event"
            fi
            test "$(jq -r .state "$event")" = "mise_ready"
            jq -n '[{kind:"eol_support_and_publication_cleanup_verified"}]' \
              > maintenance-plan-download/transition-evidence.json
            ./scripts/maintenance-event --event "$event" --target complete \
              --evidence maintenance-plan-download/transition-evidence.json --output "$event.next"
            mv "$event.next" "$event"
            base="$(git rev-parse HEAD)"
            branch="maintenance/eol-complete-${{ github.run_id }}"
            git checkout -B "$branch"
            git add "$event"
            git -c user.name=maintenance-lifecycle -c user.email=maintenance@invalid \
              commit -m "chore: complete $action_key"
            head="$(git rev-parse HEAD)"
            digest="sha256:$(shasum -a 256 "$event" | awk '{print $1}')"
            gh auth setup-git
            git push origin HEAD
            url="$(gh pr create --base main --head "$branch" --title "chore: complete $action_key" \
              --body "Deterministic EOL completion bound to exact cross-repository readiness.")"
            number="${url##*/}"
            gh pr checks "$number" --watch --fail-fast --interval 10
            gh pr checks "$number" --json name,bucket,link > maintenance-plan-download/eol-checks.json
            jq -e '[.[] | select(.name=="Script checks") | .bucket] == ["pass"]' maintenance-plan-download/eol-checks.json
            test "$(gh pr view "$number" --json headRefOid --jq .headRefOid)" = "$head"
            git fetch origin main
            test "$(git rev-parse origin/main)" = "$base"
            test "$(git rev-list --parents -n 1 "$head")" = "$head $base"
            test "$(git diff --name-only "$base" "$head")" = "$event"
            test "sha256:$(git show "$head:$event" | shasum -a 256 | awk '{print $1}')" = "$digest"
            gh pr merge "$number" --squash --delete-branch
            jq '.severity="info" | .summary="Branch EOL support cleanup completed at exact php-bin and mise-php commits." | .finalResult="passed"' \
              "$event" > maintenance-plan-download/eol-notification.json
            ./scripts/notify-maintenance \
              --event maintenance-plan-download/eol-notification.json \
              --state maintenance-plan-download/eol-notification-state.json \
              --output maintenance-plan-download/eol-notification-next.json \
              --backend github --repo "${{ github.repository }}" --owner "${{ vars.MAINTENANCE_OWNER }}"
          else
            echo "Action $action requires repository readiness before release." >&2
          fi

  notify-failure:
    name: Notify actionable watcher failure
    needs: investigate
    if: always() && needs.investigate.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Create structured critical event
        run: |
          jq -n \
            --arg actionKey "watcher-failure:${{ github.run_id }}" \
            --arg summary "Maintenance watcher failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{actionKey:$actionKey,state:"blocked",severity:"critical",humanActionRequired:true,summary:$summary,failureFingerprint:$actionKey}' \
            > event.json
      - name: Notify owner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/notify-maintenance \
            --event event.json \
            --state "maintenance-events/notification-watcher-failure-${{ github.run_id }}.json" \
            --output notification.json \
            --backend github \
            --repo "${{ github.repository }}" \
            --owner "${{ vars.MAINTENANCE_OWNER }}"
