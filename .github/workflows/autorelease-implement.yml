name: PHP autorelease implementation

on:
  workflow_dispatch:
    inputs:
      investigation_run_id:
        description: Run containing an admitted autorelease plan artifact
        required: true
        type: string
      exact_base_sha:
        description: Exact admitted php-bin base commit
        required: true
        type: string
      phase:
        description: Agent phase
        required: true
        default: implementation
        type: choice
        options: [implementation, repair]

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

jobs:
  # Dispatch inputs reach actions/checkout and several run scripts. They are
  # validated once here, ahead of every other job, and republished as outputs so
  # no raw inputs expression is expanded anywhere downstream.
  preflight:
    name: Validate dispatch inputs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_id: ${{ steps.validated.outputs.run_id }}
      base_sha: ${{ steps.validated.outputs.base_sha }}
      phase: ${{ steps.validated.outputs.phase }}
    steps:
      - name: Enforce exact input shapes
        id: validated
        env:
          RUN_ID: ${{ inputs.investigation_run_id }}
          BASE_SHA: ${{ inputs.exact_base_sha }}
          PHASE: ${{ inputs.phase }}
        run: |
          [[ "$RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PHASE" == "implementation" || "$PHASE" == "repair" ]]
          {
            echo "run_id=$RUN_ID"
            echo "base_sha=$BASE_SHA"
            echo "phase=$PHASE"
          } >> "$GITHUB_OUTPUT"

  implement:
    name: Offline agent and patch sealing
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.preflight.outputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Download admitted investigation
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ needs.preflight.outputs.run_id }}
        run: gh run download "$RUN_ID" --name "autorelease-investigation-$RUN_ID" --dir autorelease-run
      - name: Enforce operator pause
        run: ./autorelease/control.py operator-gate --operator-file .github/autorelease-operator.json --require-enabled
      - name: Verify exact admitted base
        env:
          BASE_SHA: ${{ needs.preflight.outputs.base_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          test "$(jq -r .preconditions.phpBinHead autorelease-run/autorelease-plan.json)" = "$BASE_SHA"
      - name: Prepare offline phase contract
        env:
          PHASE: ${{ needs.preflight.outputs.phase }}
        run: |
          phase="$PHASE"
          ./scripts/prepare-agent-task \
            --phase "$phase" \
            --action-key "$(jq -r .actionKey autorelease-run/autorelease-plan.json)" \
            --goal "Implement the exact admitted autorelease plan and leave a sealable diff." \
            --preconditions autorelease-run/preconditions.json \
            --allowed-authority workspace_write_admitted_paths \
            --allowed-authority local_advisory_checks \
            --non-goal protected_control_change \
            --non-goal irreversible_github_effect \
            --stop-condition changed_precondition \
            --stop-condition required_protected_or_unadmitted_change \
            --stop-condition required_check_unavailable \
            --shared .github/codex/autorelease/shared.md \
            --phase-template ".github/codex/autorelease/$phase.md" \
            --contract-output autorelease-run/implementation-contract.json \
            --prompt-output autorelease-run/implementation-prompt.md
          shared="$(./autorelease/control.py digest .github/codex/autorelease/shared.md)"
          phase_digest="$(./autorelease/control.py digest ".github/codex/autorelease/$phase.md")"
          event="$(./autorelease/control.py digest autorelease-run/implementation-contract.json)"
          jq --arg shared "$shared" --arg phaseTemplate "$phase_digest" --arg eventContract "$event" \
            '.agentContract.instructionDigests={shared:$shared,phaseTemplate:$phaseTemplate,eventContract:$eventContract}' \
            autorelease-run/autorelease-plan.json > autorelease-run/implementation-plan.json
          mkdir -p "$RUNNER_TEMP/codex-home"
          cp ".codex/$phase.config.toml" "$RUNNER_TEMP/codex-home/config.toml"
      - name: Run offline Codex implementation
        uses: openai/codex-action@86365089eb2b84e0a8fb0717b304f8bdcb13b20e # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          codex-version: 0.145.0
          prompt-file: autorelease-run/implementation-prompt.md
          output-file: autorelease-run/implementation-result.json
          codex-home: ${{ runner.temp }}/codex-home
          sandbox: workspace-write
          safety-strategy: drop-sudo
          allow-users: loadinglucian
          allow-bots: false
          allow-bot-users: github-actions[bot]
          codex-args: '["--strict-config","--ephemeral","--output-schema","schemas/agent-completion-assessment.schema.json"]'
      - name: Seal exact agent diff
        env:
          BASE_SHA: ${{ needs.preflight.outputs.base_sha }}
        run: |
          ./scripts/seal-autorelease-patch \
            --repo . \
            --base "$BASE_SHA" \
            --plan autorelease-run/implementation-plan.json \
            --result autorelease-run/implementation-result.json \
            --contract autorelease-run/implementation-contract.json \
            --output autorelease-run/sealed
      - name: Retain sealed patch
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sealed-autorelease-patch-${{ github.run_id }}
          path: autorelease-run/
          if-no-files-found: error
          retention-days: 90
          include-hidden-files: true

  validate:
    name: Clean deterministic validation
    needs: [preflight, implement]
    outputs:
      passed: ${{ steps.checks.outputs.passed }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.preflight.outputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: sealed-autorelease-patch-${{ github.run_id }}
          path: autorelease-run
      - name: Apply exact sealed bytes
        run: |
          test "$(./autorelease/control.py digest autorelease-run/sealed/sealed.patch)" = "$(jq -r .patchDigest autorelease-run/sealed/patch-manifest.json)"
          git apply --index autorelease-run/sealed/sealed.patch
      - name: Run authoritative checks and retain failure logs
        id: run-checks
        run: |
          set +e
          ./scripts/test.sh 2>&1 | tee autorelease-run/authoritative-checks.log
          status="${PIPESTATUS[0]}"
          set -e
          if [[ "$status" == "0" ]]; then
            echo "status=passed" >> "$GITHUB_OUTPUT"
          else
            echo "status=failed" >> "$GITHUB_OUTPUT"
          fi
      - name: Record validated SHA and tree
        if: steps.run-checks.outputs.status == 'passed'
        env:
          BASE_SHA: ${{ needs.preflight.outputs.base_sha }}
        run: |
          export GIT_AUTHOR_NAME=autorelease-validator
          export GIT_AUTHOR_EMAIL=autorelease@invalid
          export GIT_COMMITTER_NAME=autorelease-validator
          export GIT_COMMITTER_EMAIL=autorelease@invalid
          export GIT_AUTHOR_DATE=2000-01-01T00:00:00Z
          export GIT_COMMITTER_DATE=2000-01-01T00:00:00Z
          git commit -m "chore: apply admitted autorelease patch"
          jq -n --arg headSha "$(git rev-parse HEAD)" --arg tree "$(git rev-parse HEAD^{tree})" '{headSha:$headSha,tree:$tree,checks:{"Script checks":"success"}}' > autorelease-run/validation.json
          git bundle create autorelease-run/validated.bundle HEAD "^$BASE_SHA"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: steps.run-checks.outputs.status == 'passed'
        with:
          name: validated-autorelease-patch-${{ github.run_id }}
          path: autorelease-run/
          if-no-files-found: error
          retention-days: 90
          include-hidden-files: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: steps.run-checks.outputs.status != 'passed'
        with:
          name: failed-autorelease-validation-${{ github.run_id }}
          path: autorelease-run/
          if-no-files-found: error
          retention-days: 90
          include-hidden-files: true
      # Last step on purpose: the merge job keys on this output and then downloads
      # the validated artifact, so a failed bundle or upload must leave `passed`
      # unset rather than advertise a patch that is missing or incomplete. An unset
      # output reads as not-passed to both merge and repair. validate-repair needs
      # no equivalent: merge gates on that job's own result, and its upload is
      # already the last step.
      - name: Record that the patch validated
        id: checks
        if: steps.run-checks.outputs.status == 'passed'
        run: echo "passed=true" >> "$GITHUB_OUTPUT"

  repair:
    name: One bounded offline repair
    needs: [preflight, validate]
    if: needs.validate.outputs.passed != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.preflight.outputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: failed-autorelease-validation-${{ github.run_id }}
          path: autorelease-run
      - name: Restore failed patch and prepare exact repair contract
        run: |
          git apply --index autorelease-run/sealed/sealed.patch
          fingerprint="$(./autorelease/control.py digest autorelease-run/authoritative-checks.log)"
          ./scripts/prepare-agent-task \
            --phase repair \
            --action-key "$(jq -r .actionKey autorelease-run/implementation-plan.json)" \
            --goal "Repair the retained authoritative failure $fingerprint without expanding the admitted diff." \
            --preconditions autorelease-run/preconditions.json \
            --allowed-authority workspace_write_admitted_paths \
            --allowed-authority local_advisory_checks \
            --non-goal protected_control_change \
            --non-goal irreversible_github_effect \
            --stop-condition changed_precondition \
            --stop-condition repeated_or_unrelated_failure \
            --stop-condition required_protected_or_unadmitted_change \
            --shared .github/codex/autorelease/shared.md \
            --phase-template .github/codex/autorelease/repair.md \
            --contract-output autorelease-run/repair-contract.json \
            --prompt-output autorelease-run/repair-prompt-base.md
          shared="$(./autorelease/control.py digest .github/codex/autorelease/shared.md)"
          phase_digest="$(./autorelease/control.py digest .github/codex/autorelease/repair.md)"
          event="$(./autorelease/control.py digest autorelease-run/repair-contract.json)"
          jq --arg shared "$shared" --arg phaseTemplate "$phase_digest" --arg eventContract "$event" \
            '.agentContract.instructionDigests={shared:$shared,phaseTemplate:$phaseTemplate,eventContract:$eventContract}' \
            autorelease-run/implementation-plan.json > autorelease-run/repair-plan.json
          {
            cat autorelease-run/repair-prompt-base.md
            printf '\n\n# Retained authoritative failure log\n\n```text\n'
            cat autorelease-run/authoritative-checks.log
            printf '\n```\n\n# Exact admitted plan\n\n```json\n'
            jq . autorelease-run/repair-plan.json
            printf '\n```\n'
          } > autorelease-run/repair-prompt.md
          mkdir -p "$RUNNER_TEMP/codex-home"
          cp .codex/repair.config.toml "$RUNNER_TEMP/codex-home/config.toml"
      - name: Run one offline Codex repair
        uses: openai/codex-action@86365089eb2b84e0a8fb0717b304f8bdcb13b20e # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          codex-version: 0.145.0
          prompt-file: autorelease-run/repair-prompt.md
          output-file: autorelease-run/repair-result.json
          codex-home: ${{ runner.temp }}/codex-home
          sandbox: workspace-write
          safety-strategy: drop-sudo
          allow-users: loadinglucian
          allow-bots: false
          allow-bot-users: github-actions[bot]
          codex-args: '["--strict-config","--ephemeral","--output-schema","schemas/agent-completion-assessment.schema.json"]'
      - name: Seal the combined repaired diff
        env:
          BASE_SHA: ${{ needs.preflight.outputs.base_sha }}
        run: |
          mv autorelease-run/repair-plan.json autorelease-run/implementation-plan.json
          ./scripts/seal-autorelease-patch \
            --repo . \
            --base "$BASE_SHA" \
            --plan autorelease-run/implementation-plan.json \
            --result autorelease-run/repair-result.json \
            --contract autorelease-run/repair-contract.json \
            --output autorelease-run/sealed-repair
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: repaired-autorelease-patch-${{ github.run_id }}
          path: autorelease-run/
          if-no-files-found: error
          retention-days: 90
          include-hidden-files: true

  validate-repair:
    name: Clean deterministic repair validation
    needs: [preflight, repair]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.preflight.outputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: repaired-autorelease-patch-${{ github.run_id }}
          path: autorelease-run
      - name: Apply and validate exact repaired bytes
        run: |
          test "$(./autorelease/control.py digest autorelease-run/sealed-repair/sealed.patch)" = "$(jq -r .patchDigest autorelease-run/sealed-repair/patch-manifest.json)"
          git apply --index autorelease-run/sealed-repair/sealed.patch
          ./scripts/test.sh
          cp autorelease-run/sealed-repair/sealed.patch autorelease-run/sealed/sealed.patch
          cp autorelease-run/sealed-repair/patch-manifest.json autorelease-run/sealed/patch-manifest.json
      - name: Record repaired validated SHA and tree
        env:
          BASE_SHA: ${{ needs.preflight.outputs.base_sha }}
        run: |
          export GIT_AUTHOR_NAME=autorelease-validator
          export GIT_AUTHOR_EMAIL=autorelease@invalid
          export GIT_COMMITTER_NAME=autorelease-validator
          export GIT_COMMITTER_EMAIL=autorelease@invalid
          export GIT_AUTHOR_DATE=2000-01-01T00:00:00Z
          export GIT_COMMITTER_DATE=2000-01-01T00:00:00Z
          git commit -m "chore: apply admitted autorelease repair"
          jq -n --arg headSha "$(git rev-parse HEAD)" --arg tree "$(git rev-parse HEAD^{tree})" '{headSha:$headSha,tree:$tree,checks:{"Script checks":"success"}}' > autorelease-run/validation.json
          git bundle create autorelease-run/validated.bundle HEAD "^$BASE_SHA"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: validated-autorelease-patch-${{ github.run_id }}
          path: autorelease-run/
          if-no-files-found: error
          retention-days: 90
          include-hidden-files: true

  merge:
    name: Exact-SHA PR and merge admission
    needs: [preflight, validate, validate-repair]
    # always() keeps this job reachable when repair paths skip, so the preflight
    # result is asserted explicitly. Without it a rejected dispatch input would
    # still reach checkout, with an empty ref.
    if: always() && needs.preflight.result == 'success' && (needs.validate.outputs.passed == 'true' || needs['validate-repair'].result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 130
    permissions:
      contents: write
      pull-requests: write
      checks: write
      actions: write
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.preflight.outputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: validated-autorelease-patch-${{ github.run_id }}
          path: autorelease-run
      - name: Restore exact validated commit
        run: |
          validated="$(jq -r .headSha autorelease-run/validation.json)"
          git fetch autorelease-run/validated.bundle HEAD
          git checkout --detach "$validated"
          test "$(git rev-parse HEAD)" = "$validated"
      - name: Create or reuse automation PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          action_key="$(jq -r .actionKey autorelease-run/implementation-plan.json)"
          branch="autorelease/$(./autorelease/control.py action-filename "$action_key" --suffix '')"
          gh auth setup-git
          git push origin "HEAD:refs/heads/$branch"
          existing="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if [[ -z "$existing" ]]; then
            url="$(gh pr create --base main --head "$branch" --title "chore: $action_key" \
              --body "Deterministically sealed autorelease patch for \`$action_key\`.\n\nValidated commit: \`$(git rev-parse HEAD)\`.")"
            existing="${url##*/}"
          fi
          echo "number=$existing" >> "$GITHUB_OUTPUT"
      - name: Wait for required checks on exact head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/dispatch-pr-checks \
            --pr "${{ steps.pr.outputs.number }}" \
            --check "Script checks" \
            --output autorelease-run/pr-checks.json
          ./scripts/assert-admission-checks --checks autorelease-run/pr-checks.json
      - name: Re-verify exact SHA, sealed tree, and preconditions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          expected="$(jq -r .headSha autorelease-run/validation.json)"
          actual="$(gh pr view "${{ steps.pr.outputs.number }}" --json headRefOid --jq .headRefOid)"
          test "$actual" = "$expected"
          test "$(git rev-parse HEAD)" = "$expected"
          admitted_head="$(jq -r .preconditions.phpBinHead autorelease-run/implementation-plan.json)"
          admitted_policy="$(jq -r .preconditions.supportPolicyDigest autorelease-run/implementation-plan.json)"
          git fetch origin main
          current_head="$(git rev-parse origin/main)"
          current_policy="sha256:$(git show origin/main:support-policy.json | shasum -a 256 | awk '{print $1}')"
          jq -n --arg phpBinHead "$admitted_head" --arg supportPolicyDigest "$admitted_policy" \
            '{phpBinHead:$phpBinHead,supportPolicyDigest:$supportPolicyDigest}' > autorelease-run/preconditions.json
          jq -n --arg phpBinHead "$current_head" --arg supportPolicyDigest "$current_policy" \
            '{phpBinHead:$phpBinHead,supportPolicyDigest:$supportPolicyDigest}' > autorelease-run/current.json
          jq -n '{"Script checks":"success"}' > autorelease-run/checks.json
          ./scripts/verify-merge-admission \
            --repo . \
            --head "$expected" \
            --manifest autorelease-run/sealed/patch-manifest.json \
            --checks autorelease-run/checks.json \
            --preconditions autorelease-run/preconditions.json \
            --current autorelease-run/current.json
      - name: Merge admitted exact commit
        id: merged
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge "${{ steps.pr.outputs.number }}" --squash --delete-branch
          echo "commit=$(gh pr view "${{ steps.pr.outputs.number }}" --json mergeCommit --jq .mergeCommit.oid)" >> "$GITHUB_OUTPUT"
      - name: Commit deterministic php_bin_ready event record
        id: readiness
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "${{ steps.merged.outputs.commit }}"
          test "$(git rev-parse "${{ steps.merged.outputs.commit }}^{tree}")" = "$(jq -r .tree autorelease-run/validation.json)"
          git checkout -B "autorelease/readiness-${{ github.run_id }}" origin/main
          base="$(git rev-parse HEAD)"
          action_key="$(jq -r .actionKey autorelease-run/implementation-plan.json)"
          filename="$(./autorelease/control.py action-filename "$action_key")"
          mkdir -p autorelease-events
          jq -n \
            --arg actionKey "$action_key" \
            --arg classification "$(jq -r .action autorelease-run/implementation-plan.json)" \
            --arg phpBinCommit "${{ steps.merged.outputs.commit }}" \
            --arg planDigest "$(jq -r .planDigest autorelease-run/sealed/patch-manifest.json)" \
            --arg policyDigest "$(./autorelease/control.py digest support-policy.json)" \
            --arg policyInvariantsDigest "$(./autorelease/control.py digest autorelease/policy-invariants.json)" \
            --arg evidenceManifestDigest "$(jq -r .manifestDigest autorelease-run/evidence/evidence-manifest.json)" \
            --argjson evidenceDigests "$(jq '[.captures[].digest]' autorelease-run/evidence/evidence-manifest.json)" \
            --argjson instructionDigests "$(jq .agentContract.instructionDigests autorelease-run/implementation-plan.json)" \
            '{
              schemaVersion:1,
              actionKey:$actionKey,
              classification:$classification,
              state:"detected",
              history:[],
              phpBinCommit:$phpBinCommit,
              planDigest:$planDigest,
              supportPolicyDigest:$policyDigest,
              policyInvariantsDigest:$policyInvariantsDigest,
              evidenceManifestDigest:$evidenceManifestDigest,
              evidenceDigests:$evidenceDigests,
              instructionDigests:$instructionDigests
            }' > "autorelease-events/$filename"
          jq -n \
            --arg commit "${{ steps.merged.outputs.commit }}" \
            --arg planDigest "$(jq -r .planDigest autorelease-run/sealed/patch-manifest.json)" \
            '[{kind:"validated_merge",commit:$commit,planDigest:$planDigest}]' > autorelease-run/readiness-evidence.json
          ./scripts/autorelease-event \
            --event "autorelease-events/$filename" \
            --target php_bin_ready \
            --evidence autorelease-run/readiness-evidence.json \
            --output "autorelease-events/$filename.next"
          mv "autorelease-events/$filename.next" "autorelease-events/$filename"
          git add "autorelease-events/$filename"
          git -c user.name=autorelease-readiness -c user.email=autorelease@invalid \
            commit -m "chore: record $action_key php-bin readiness"
          head="$(git rev-parse HEAD)"
          record="autorelease-events/$filename"
          digest="sha256:$(shasum -a 256 "$record" | awk '{print $1}')"
          gh auth setup-git
          git push origin HEAD
          url="$(gh pr create --base main --head "autorelease/readiness-${{ github.run_id }}" \
            --title "chore: record $action_key php-bin readiness" \
            --body "Deterministic event state for the exact merged implementation commit.")"
          echo "number=${url##*/}" >> "$GITHUB_OUTPUT"
          echo "base_sha=$base" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head" >> "$GITHUB_OUTPUT"
          echo "record=$record" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Validate and merge php-bin readiness record
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/dispatch-pr-checks \
            --pr "${{ steps.readiness.outputs.number }}" \
            --check "Script checks" \
            --output autorelease-run/readiness-checks.json
          ./scripts/assert-admission-checks --checks autorelease-run/readiness-checks.json
          actual="$(gh pr view "${{ steps.readiness.outputs.number }}" --json headRefOid --jq .headRefOid)"
          test "$actual" = "${{ steps.readiness.outputs.head_sha }}"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "${{ steps.readiness.outputs.base_sha }}"
          test "$(git rev-list --parents -n 1 "$actual")" = "$actual ${{ steps.readiness.outputs.base_sha }}"
          test "$(git diff --name-only "${{ steps.readiness.outputs.base_sha }}" "$actual")" = "${{ steps.readiness.outputs.record }}"
          test "sha256:$(git show "$actual:${{ steps.readiness.outputs.record }}" | shasum -a 256 | awk '{print $1}')" = "${{ steps.readiness.outputs.digest }}"
          gh pr merge "${{ steps.readiness.outputs.number }}" --squash --delete-branch
