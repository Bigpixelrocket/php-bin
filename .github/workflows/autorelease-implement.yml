name: PHP autorelease implementation

on:
  workflow_dispatch:
    inputs:
      investigation_run_id:
        description: Run containing an admitted autorelease plan artifact
        required: true
        type: string
      exact_base_sha:
        description: Exact admitted php-bin base commit
        required: true
        type: string

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

jobs:
  # Dispatch inputs reach actions/checkout and several run scripts. They are
  # validated once here, ahead of every other job, and republished as outputs so
  # no raw inputs expression is expanded anywhere downstream.
  preflight:
    name: Validate dispatch inputs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_id: ${{ steps.validated.outputs.run_id }}
      base_sha: ${{ steps.validated.outputs.base_sha }}
    steps:
      - name: Enforce exact input shapes
        id: validated
        env:
          RUN_ID: ${{ inputs.investigation_run_id }}
          BASE_SHA: ${{ inputs.exact_base_sha }}
        run: |
          [[ "$RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          {
            echo "run_id=$RUN_ID"
            echo "base_sha=$BASE_SHA"
          } >> "$GITHUB_OUTPUT"

  implement:
    name: Deterministic lifecycle edit and sealing
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      action_key: ${{ steps.admitted.outputs.action_key }}
      action: ${{ steps.admitted.outputs.action }}
      version: ${{ steps.admitted.outputs.version }}
      already_applied: ${{ steps.sealed.outputs.already_applied }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.preflight.outputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Download admitted classification
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ needs.preflight.outputs.run_id }}
        run: gh run download "$RUN_ID" --name "autorelease-investigation-$RUN_ID" --dir autorelease-run
      - name: Expose the admitted action
        id: admitted
        run: |
          action_key="$(jq -r .actionKey autorelease-run/autorelease-plan.json)"
          action="$(jq -r .action autorelease-run/autorelease-plan.json)"
          # The key reaches outputs and later shell steps, so its alphabet is
          # re-asserted here by the one mapping every record name derives from.
          ./autorelease/control.py action-filename "$action_key" > /dev/null
          test "$(jq -r .actionKey autorelease-run/admission.json)" = "$action_key"
          [[ "$action" == "new_branch" || "$action" == "branch_eol" ]]
          version="$(jq -r '.releaseIntent.version // ""' autorelease-run/autorelease-plan.json)"
          [[ -z "$version" || "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          {
            echo "action_key=$action_key"
            echo "action=$action"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
      - name: Enforce operator pause
        run: ./autorelease/control.py operator-gate --operator-file .github/autorelease-operator.json --require-enabled
      - name: Verify exact admitted base
        env:
          BASE_SHA: ${{ needs.preflight.outputs.base_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          test "$(jq -r .preconditions.phpBinHead autorelease-run/autorelease-plan.json)" = "$BASE_SHA"
      - name: Apply the admitted lifecycle edit
        run: |
          ./scripts/apply-autorelease-plan \
            --plan autorelease-run/autorelease-plan.json \
            --manifest autorelease-run/evidence/evidence-manifest.json \
            --repo .
      - name: Seal exact deterministic diff
        id: sealed
        env:
          BASE_SHA: ${{ needs.preflight.outputs.base_sha }}
        run: |
          ./scripts/seal-autorelease-patch \
            --repo . \
            --base "$BASE_SHA" \
            --plan autorelease-run/autorelease-plan.json \
            --output autorelease-run/sealed
          # A resumed lifecycle whose edit already merged seals an empty patch. Every
          # later job then validates, builds, and records the admitted base itself, and
          # nothing is merged except the readiness record.
          echo "already_applied=$(jq -r '.alreadyApplied == true' autorelease-run/sealed/patch-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: Retain sealed patch
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sealed-autorelease-patch-${{ github.run_id }}
          path: autorelease-run/
          if-no-files-found: error
          retention-days: 90
          include-hidden-files: true

  validate:
    name: Clean deterministic validation
    needs: [preflight, implement]
    outputs:
      passed: ${{ steps.checks.outputs.passed }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.preflight.outputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: sealed-autorelease-patch-${{ github.run_id }}
          path: autorelease-run
      - name: Apply exact sealed bytes
        run: |
          test "$(./autorelease/control.py digest autorelease-run/sealed/sealed.patch)" = "$(jq -r .patchDigest autorelease-run/sealed/patch-manifest.json)"
          if [[ "$(jq -r '.alreadyApplied == true' autorelease-run/sealed/patch-manifest.json)" == "true" ]]; then
            # The admitted edit is already on the base, so the checks run on the base.
            test "$(jq -c .files autorelease-run/sealed/patch-manifest.json)" = "[]"
            test ! -s autorelease-run/sealed/sealed.patch
          else
            git apply --index autorelease-run/sealed/sealed.patch
          fi
      - name: Run authoritative checks and retain failure logs
        id: run-checks
        run: |
          set +e
          ./scripts/test.sh 2>&1 | tee autorelease-run/authoritative-checks.log
          status="${PIPESTATUS[0]}"
          set -e
          if [[ "$status" == "0" ]]; then
            echo "status=passed" >> "$GITHUB_OUTPUT"
          else
            echo "status=failed" >> "$GITHUB_OUTPUT"
          fi
      - name: Record validated SHA and tree
        if: steps.run-checks.outputs.status == 'passed'
        env:
          BASE_SHA: ${{ needs.preflight.outputs.base_sha }}
        run: |
          if [[ "$(jq -r '.alreadyApplied == true' autorelease-run/sealed/patch-manifest.json)" == "true" ]]; then
            # Nothing was applied, so the validated commit is the admitted base, which
            # every later job checks out; there is no commit to bundle.
            test "$(git rev-parse HEAD)" = "$BASE_SHA"
            # The verdict is bound to HEAD, so the tested tree must equal it exactly.
            git diff --quiet HEAD --
          else
            export GIT_AUTHOR_NAME=autorelease-validator
            export GIT_AUTHOR_EMAIL=autorelease@invalid
            export GIT_COMMITTER_NAME=autorelease-validator
            export GIT_COMMITTER_EMAIL=autorelease@invalid
            export GIT_AUTHOR_DATE=2000-01-01T00:00:00Z
            export GIT_COMMITTER_DATE=2000-01-01T00:00:00Z
            git commit -m "chore: apply admitted autorelease patch"
            git bundle create autorelease-run/validated.bundle HEAD "^$BASE_SHA"
          fi
          jq -n --arg headSha "$(git rev-parse HEAD)" --arg tree "$(git rev-parse "HEAD^{tree}")" '{headSha:$headSha,tree:$tree,checks:{"Script checks":"success"}}' > autorelease-run/validation.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: steps.run-checks.outputs.status == 'passed'
        with:
          name: validated-autorelease-patch-${{ github.run_id }}
          path: autorelease-run/
          if-no-files-found: error
          retention-days: 90
          include-hidden-files: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: steps.run-checks.outputs.status != 'passed'
        with:
          name: failed-autorelease-validation-${{ github.run_id }}
          path: autorelease-run/
          if-no-files-found: error
          retention-days: 90
          include-hidden-files: true
      # There is no repair phase: a failing check fails this job after its log is
      # retained, and notify-failure raises the owner issue.
      - name: Stop on a failed authoritative check
        if: steps.run-checks.outputs.status != 'passed'
        run: |
          echo "Authoritative checks failed on the sealed lifecycle edit; see authoritative-checks.log." >&2
          exit 1
      # Last step on purpose: later jobs key on this output and then download the
      # validated artifact, so a failed bundle or upload must leave `passed` unset
      # rather than advertise a patch that is missing or incomplete.
      - name: Record that the patch validated
        id: checks
        run: echo "passed=true" >> "$GITHUB_OUTPUT"

  # A new branch merges only once its first release actually builds at the validated
  # commit and passes the exact module comparison against the list the lifecycle edit
  # copied. The build holds a read-only token, exactly like the publish build.
  build-new-branch:
    name: Build the new branch at the validated commit
    needs: [preflight, implement, validate]
    if: needs.validate.outputs.passed == 'true' && needs.implement.outputs.action == 'new_branch'
    runs-on: macos-26
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.implement.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.preflight.outputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: validated-autorelease-patch-${{ github.run_id }}
          path: autorelease-run
      - name: Restore exact validated commit
        env:
          BASE_SHA: ${{ needs.preflight.outputs.base_sha }}
        run: |
          validated="$(jq -r .headSha autorelease-run/validation.json)"
          if [[ "$(jq -r '.alreadyApplied == true' autorelease-run/sealed/patch-manifest.json)" == "true" ]]; then
            # An already-applied edit validated the admitted base, which is checked out.
            test "$validated" = "$BASE_SHA"
          else
            git fetch autorelease-run/validated.bundle HEAD
            git checkout --detach "$validated"
          fi
          test "$(git rev-parse HEAD)" = "$validated"
          test "$(uname -s)" = Darwin && test "$(uname -m)" = arm64
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
      - name: Install build dependencies
        run: ./scripts/install-build-deps.sh
      - name: Install pinned StaticPHP
        run: ./scripts/install-spc.sh
      - name: Build and compare modules exactly
        env:
          # StaticPHP authenticates GitHub API calls only through this variable.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p new-branch-build
          set +e
          ./scripts/build.sh "$VERSION" s4 2>&1 | tee new-branch-build/build.log
          status="${PIPESTATUS[0]}"
          set -e
          if [[ "$status" != "0" ]]; then
            # compare-modules.sh names every missing (-) and unexpected (+) module
            # under the check that found it; that is the diff the owner acts on.
            grep -E '^(Checking |Missing modules:|Unexpected modules:|  [-+] |Built shared extensions differ)' \
              new-branch-build/build.log > new-branch-build/module-diff.txt || true
            # Only a module comparison that named missing or unexpected modules is a
            # module-list problem; any other build failure keeps the generic report.
            if ! grep -qE '^(Missing modules:|Unexpected modules:)' new-branch-build/module-diff.txt; then
              rm -f new-branch-build/module-diff.txt
            fi
            exit "$status"
          fi
      - name: Retain the module comparison
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: new-branch-build-${{ github.run_id }}
          path: new-branch-build/
          if-no-files-found: error
          retention-days: 90

  merge:
    name: Exact-SHA PR and merge admission
    needs: [preflight, implement, validate, build-new-branch]
    # always() keeps this job reachable when the branch build is skipped for an EOL, so
    # the preflight result is asserted explicitly. Without it a rejected dispatch input
    # would still reach checkout, with an empty ref.
    if: always() && needs.preflight.result == 'success' && needs.validate.outputs.passed == 'true' && (needs['build-new-branch'].result == 'success' || needs['build-new-branch'].result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 130
    permissions:
      contents: write
      pull-requests: write
      checks: write
      actions: write
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.preflight.outputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: validated-autorelease-patch-${{ github.run_id }}
          path: autorelease-run
      - name: Restore exact validated commit
        env:
          BASE_SHA: ${{ needs.preflight.outputs.base_sha }}
        run: |
          validated="$(jq -r .headSha autorelease-run/validation.json)"
          if [[ "$(jq -r '.alreadyApplied == true' autorelease-run/sealed/patch-manifest.json)" == "true" ]]; then
            # An already-applied edit validated the admitted base, which is checked out.
            test "$validated" = "$BASE_SHA"
          else
            git fetch autorelease-run/validated.bundle HEAD
            git checkout --detach "$validated"
          fi
          test "$(git rev-parse HEAD)" = "$validated"
      - name: Create or reuse automation PR
        id: pr
        if: needs.implement.outputs.already_applied != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          action_key="$(jq -r .actionKey autorelease-run/autorelease-plan.json)"
          branch="autorelease/$(./autorelease/control.py action-filename "$action_key" --suffix '')"
          gh auth setup-git
          # A retry after a failed merge validates a new commit that does not descend
          # from the earlier attempt, so the automation branch is replaced under a lease
          # and any open PR on it is reused; the exact-SHA gates below still bind the
          # merge to this run's validated commit.
          # The fetch is forced so the tracking ref, and with it the lease, is exactly the
          # branch head GitHub reports now, whatever an earlier attempt left behind.
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            git fetch origin "+refs/heads/$branch:refs/remotes/origin/$branch"
          fi
          git push --force-with-lease origin "HEAD:refs/heads/$branch"
          existing="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if [[ -z "$existing" ]]; then
            body="$(printf "Deterministically sealed autorelease patch for \`%s\`.\n\nValidated commit: \`%s\`." \
              "$action_key" "$(git rev-parse HEAD)")"
            url="$(gh pr create --base main --head "$branch" --title "chore: $action_key" --body "$body")"
            existing="${url##*/}"
          fi
          echo "number=$existing" >> "$GITHUB_OUTPUT"
      - name: Wait for required checks on exact head
        if: needs.implement.outputs.already_applied != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/dispatch-pr-checks \
            --pr "${{ steps.pr.outputs.number }}" \
            --check "Script checks" \
            --output autorelease-run/pr-checks.json
          ./scripts/assert-admission-checks --checks autorelease-run/pr-checks.json
      - name: Re-verify exact SHA, sealed tree, and preconditions
        if: needs.implement.outputs.already_applied != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          expected="$(jq -r .headSha autorelease-run/validation.json)"
          actual="$(gh pr view "${{ steps.pr.outputs.number }}" --json headRefOid --jq .headRefOid)"
          test "$actual" = "$expected"
          test "$(git rev-parse HEAD)" = "$expected"
          admitted_head="$(jq -r .preconditions.phpBinHead autorelease-run/autorelease-plan.json)"
          admitted_policy="$(jq -r .preconditions.supportPolicyDigest autorelease-run/autorelease-plan.json)"
          git fetch origin main
          current_head="$(git rev-parse origin/main)"
          current_policy="sha256:$(git show origin/main:support-policy.json | shasum -a 256 | awk '{print $1}')"
          jq -n --arg phpBinHead "$admitted_head" --arg supportPolicyDigest "$admitted_policy" \
            '{phpBinHead:$phpBinHead,supportPolicyDigest:$supportPolicyDigest}' > autorelease-run/preconditions.json
          jq -n --arg phpBinHead "$current_head" --arg supportPolicyDigest "$current_policy" \
            '{phpBinHead:$phpBinHead,supportPolicyDigest:$supportPolicyDigest}' > autorelease-run/current.json
          jq -n '{"Script checks":"success"}' > autorelease-run/checks.json
          ./scripts/verify-merge-admission \
            --repo . \
            --head "$expected" \
            --manifest autorelease-run/sealed/patch-manifest.json \
            --checks autorelease-run/checks.json \
            --preconditions autorelease-run/preconditions.json \
            --current autorelease-run/current.json
      - name: Merge admitted exact commit
        id: merged
        if: needs.implement.outputs.already_applied != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The branch can be replaced by a later attempt, so the merge itself is bound
          # to this run's validated commit.
          gh pr merge "${{ steps.pr.outputs.number }}" --squash --delete-branch \
            --match-head-commit "$(jq -r .headSha autorelease-run/validation.json)"
          echo "commit=$(gh pr view "${{ steps.pr.outputs.number }}" --json mergeCommit --jq .mergeCommit.oid)" >> "$GITHUB_OUTPUT"
      # A resumed lifecycle merged its edit in an earlier run that stopped before its
      # readiness record, so no PR is opened and nothing is merged. The validated commit
      # must be the admitted base and still be main under the admitted policy; the
      # validation job's checks ran on exactly that commit.
      - name: Re-verify the already-merged edit at the validated commit
        id: onmain
        if: needs.implement.outputs.already_applied == 'true'
        run: |
          expected="$(jq -r .headSha autorelease-run/validation.json)"
          test "$(git rev-parse HEAD)" = "$expected"
          admitted_head="$(jq -r .preconditions.phpBinHead autorelease-run/autorelease-plan.json)"
          admitted_policy="$(jq -r .preconditions.supportPolicyDigest autorelease-run/autorelease-plan.json)"
          git fetch origin main
          current_head="$(git rev-parse origin/main)"
          current_policy="sha256:$(git show origin/main:support-policy.json | shasum -a 256 | awk '{print $1}')"
          jq -n --arg phpBinHead "$admitted_head" --arg supportPolicyDigest "$admitted_policy" \
            '{phpBinHead:$phpBinHead,supportPolicyDigest:$supportPolicyDigest}' > autorelease-run/preconditions.json
          jq -n --arg phpBinHead "$current_head" --arg supportPolicyDigest "$current_policy" \
            '{phpBinHead:$phpBinHead,supportPolicyDigest:$supportPolicyDigest}' > autorelease-run/current.json
          jq .checks autorelease-run/validation.json > autorelease-run/checks.json
          ./scripts/verify-merge-admission \
            --repo . \
            --head "$expected" \
            --manifest autorelease-run/sealed/patch-manifest.json \
            --checks autorelease-run/checks.json \
            --preconditions autorelease-run/preconditions.json \
            --current autorelease-run/current.json
          echo "commit=$expected" >> "$GITHUB_OUTPUT"
      - name: Commit deterministic php_bin_ready event record
        id: readiness
        env:
          GH_TOKEN: ${{ github.token }}
          # Exactly one of the two steps above ran and named the commit now on main.
          MERGED_COMMIT: ${{ steps.merged.outputs.commit || steps.onmain.outputs.commit }}
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$MERGED_COMMIT"
          test "$(git rev-parse "$MERGED_COMMIT^{tree}")" = "$(jq -r .tree autorelease-run/validation.json)"
          git checkout -B "autorelease/readiness-${{ github.run_id }}" origin/main
          base="$(git rev-parse HEAD)"
          action_key="$(jq -r .actionKey autorelease-run/autorelease-plan.json)"
          filename="$(./autorelease/control.py action-filename "$action_key")"
          mkdir -p autorelease-events
          jq -n \
            --arg actionKey "$action_key" \
            --arg classification "$(jq -r .action autorelease-run/autorelease-plan.json)" \
            --arg phpBinCommit "$MERGED_COMMIT" \
            --arg planDigest "$(jq -r .planDigest autorelease-run/sealed/patch-manifest.json)" \
            --arg policyDigest "$(./autorelease/control.py digest support-policy.json)" \
            --arg policyInvariantsDigest "$(./autorelease/control.py digest autorelease/policy-invariants.json)" \
            --arg evidenceManifestDigest "$(jq -r .manifestDigest autorelease-run/evidence/evidence-manifest.json)" \
            --argjson evidenceDigests "$(jq '[.captures[].digest]' autorelease-run/evidence/evidence-manifest.json)" \
            '{
              schemaVersion:1,
              actionKey:$actionKey,
              classification:$classification,
              state:"detected",
              history:[],
              phpBinCommit:$phpBinCommit,
              planDigest:$planDigest,
              supportPolicyDigest:$policyDigest,
              policyInvariantsDigest:$policyInvariantsDigest,
              evidenceManifestDigest:$evidenceManifestDigest,
              evidenceDigests:$evidenceDigests
            }' > "autorelease-events/$filename"
          jq -n \
            --arg commit "$MERGED_COMMIT" \
            --arg planDigest "$(jq -r .planDigest autorelease-run/sealed/patch-manifest.json)" \
            '[{kind:"validated_merge",commit:$commit,planDigest:$planDigest}]' > autorelease-run/readiness-evidence.json
          ./scripts/autorelease-event \
            --event "autorelease-events/$filename" \
            --target php_bin_ready \
            --evidence autorelease-run/readiness-evidence.json \
            --output "autorelease-events/$filename.next"
          mv "autorelease-events/$filename.next" "autorelease-events/$filename"
          git add "autorelease-events/$filename"
          git -c user.name=autorelease-readiness -c user.email=autorelease@invalid \
            commit -m "chore: record $action_key php-bin readiness"
          head="$(git rev-parse HEAD)"
          record="autorelease-events/$filename"
          digest="sha256:$(shasum -a 256 "$record" | awk '{print $1}')"
          gh auth setup-git
          git push origin HEAD
          url="$(gh pr create --base main --head "autorelease/readiness-${{ github.run_id }}" \
            --title "chore: record $action_key php-bin readiness" \
            --body "Deterministic event state for the exact merged implementation commit.")"
          {
            echo "number=${url##*/}"
            echo "base_sha=$base"
            echo "head_sha=$head"
            echo "record=$record"
            echo "digest=$digest"
          } >> "$GITHUB_OUTPUT"
      - name: Validate and merge php-bin readiness record
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/merge-record-pr \
            --pr "${{ steps.readiness.outputs.number }}" \
            --base "${{ steps.readiness.outputs.base_sha }}" \
            --head "${{ steps.readiness.outputs.head_sha }}" \
            --record "${{ steps.readiness.outputs.record }}" \
            --digest "${{ steps.readiness.outputs.digest }}" \
            --checks-output autorelease-run/readiness-checks.json \
            --require-protected-controls

  # Any failed phase stops here with one deduplicated owner issue on the action key.
  # A new branch whose build fails the exact module comparison carries that module
  # diff, so the owner can correct expected-modules/<branch>.txt by pull request.
  notify-failure:
    name: Notify actionable implementation failure
    needs: [preflight, implement, validate, build-new-branch, merge]
    if: always() && needs.preflight.result == 'success' && (needs.implement.result == 'failure' || needs.validate.result == 'failure' || needs['build-new-branch'].result == 'failure' || needs.merge.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Only a failed branch build retains a module comparison; every other failure
      # keeps the generic summary below.
      - name: Download the module comparison
        if: needs['build-new-branch'].result == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: new-branch-build-${{ github.run_id }}
          path: new-branch-build
      - name: Create a structured event keyed on the admitted action
        env:
          ACTION_KEY: ${{ needs.implement.outputs.action_key }}
          VERSION: ${{ needs.implement.outputs.version }}
          BUILD_RESULT: ${{ needs['build-new-branch'].result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # An implement job that failed before exposing its key still reports, under
          # a key namespaced to this run.
          if [[ -z "$ACTION_KEY" ]]; then
            ACTION_KEY="implementation-failure:${{ github.run_id }}"
          else
            ./autorelease/control.py action-filename "$ACTION_KEY" > /dev/null
          fi
          if [[ "$BUILD_RESULT" == "failure" && -s new-branch-build/module-diff.txt ]]; then
            state=needs_human
            # The issue body is Markdown; the fence is built from octal escapes so the
            # format string holds no backquotes for the shell to misread.
            fence="$(printf '\140\140\140')"
            summary="$(printf 'The first build of PHP %s failed the exact module comparison against the copied module list, so nothing was merged. Correct expected-modules/%s.txt by pull request; the next watcher run retries the branch.\n\n%stext\n%s\n%s\n\nRun: %s' \
              "$VERSION" "${VERSION%.*}" "$fence" "$(head -n 200 new-branch-build/module-diff.txt)" "$fence" "$RUN_URL")"
            fingerprint="module-diff:$(shasum -a 256 new-branch-build/module-diff.txt | awk '{print $1}')"
          else
            state=blocked
            # The merge job can fail after the lifecycle edit merged, so this summary
            # claims nothing about main; the next watcher run classifies what landed.
            summary="Autorelease implementation of $ACTION_KEY failed: $RUN_URL"
            fingerprint="implementation-failure:$ACTION_KEY"
          fi
          jq -n \
            --arg actionKey "$ACTION_KEY" \
            --arg state "$state" \
            --arg summary "$summary" \
            --arg failureFingerprint "$fingerprint" \
            '{actionKey:$actionKey,state:$state,severity:"critical",humanActionRequired:true,summary:$summary,failureFingerprint:$failureFingerprint}' \
            > event.json
      - name: Notify owner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/notify-autorelease \
            --event event.json \
            --state notification-state.json \
            --output notification.json \
            --backend github \
            --repo "${{ github.repository }}" \
            --owner "${{ vars.AUTORELEASE_OWNER }}"
