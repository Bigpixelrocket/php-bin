name: Autorelease publish transaction

on:
  workflow_dispatch:
    inputs:
      version:
        description: Admitted stable PHP patch or rebuild tag
        required: true
        type: string
      exact_commit:
        description: Exact admitted merged php-bin commit
        required: true
        type: string
      action_key:
        description: Exact admitted autorelease action key
        required: true
        type: string
      investigation_run_id:
        description: Run containing retained admitted evidence and plan
        required: true
        type: string

permissions:
  contents: write
  issues: write
  actions: write
  checks: write
  pull-requests: write
  statuses: write

concurrency:
  group: autorelease-publish-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  # Dispatch inputs reach actions/checkout and many run scripts. They are shaped
  # once here, ahead of every other job, and republished as outputs so no raw
  # inputs expression is expanded anywhere downstream.
  preflight:
    name: Validate dispatch inputs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.validated.outputs.version }}
      exact_commit: ${{ steps.validated.outputs.exact_commit }}
      action_key: ${{ steps.validated.outputs.action_key }}
      investigation_run_id: ${{ steps.validated.outputs.investigation_run_id }}
    steps:
      - name: Enforce exact input shapes
        id: validated
        env:
          VERSION: ${{ inputs.version }}
          EXACT_COMMIT: ${{ inputs.exact_commit }}
          ACTION_KEY: ${{ inputs.action_key }}
          INVESTIGATION_RUN_ID: ${{ inputs.investigation_run_id }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[1-9][0-9]*)?$ ]]
          [[ "$EXACT_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ACTION_KEY" =~ ^[A-Za-z0-9._:-]+$ ]]
          [[ "$INVESTIGATION_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          {
            echo "version=$VERSION"
            echo "exact_commit=$EXACT_COMMIT"
            echo "action_key=$ACTION_KEY"
            echo "investigation_run_id=$INVESTIGATION_RUN_ID"
          } >> "$GITHUB_OUTPUT"

  release:
    needs: preflight
    runs-on: macos-26
    timeout-minutes: 150
    environment: php-autorelease-publish
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      EXACT_COMMIT: ${{ needs.preflight.outputs.exact_commit }}
      ACTION_KEY: ${{ needs.preflight.outputs.action_key }}
      INVESTIGATION_RUN_ID: ${{ needs.preflight.outputs.investigation_run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.preflight.outputs.exact_commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: bigpixelrocket/mise-php
          path: mise-php
          persist-credentials: false
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4
      - name: Download admitted plan and retained evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$INVESTIGATION_RUN_ID" \
            --name "autorelease-investigation-$INVESTIGATION_RUN_ID" \
            --dir admitted-run
      - name: Verify stable version and exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./autorelease/control.py validate-policy
          test "$(git rev-parse HEAD)" = "$EXACT_COMMIT"
          test "$(jq -r .actionKey admitted-run/autorelease-plan.json)" = "$ACTION_KEY"
          test "$(jq -r .releaseIntent.version admitted-run/autorelease-plan.json)" = "$VERSION"
          test "$(jq -r .preconditions.phpBinHead admitted-run/autorelease-plan.json)" = "$EXACT_COMMIT"
          test "$(jq -r .preconditions.supportPolicyDigest admitted-run/autorelease-plan.json)" = "$(./autorelease/control.py digest support-policy.json)"
          test "$(jq -r .unattendedMutation .github/autorelease-operator.json)" = "enabled"
          mkdir -p release-run
          gh api "repos/${{ github.repository }}/contents/.github/autorelease-operator.json?ref=main" \
            --jq .content | base64 --decode > release-run/current-operator.json
          test "$(jq -r .unattendedMutation release-run/current-operator.json)" = "enabled"
          mise_commit="$(jq -r .sha admitted-run/evidence/raw/mise_php_state.body)"
          [[ "$mise_commit" =~ ^[0-9a-f]{40}$ ]]
          git -C mise-php fetch origin "$mise_commit"
          git -C mise-php checkout --detach "$mise_commit"
          test "$(git -C mise-php rev-parse HEAD)" = "$mise_commit"
      - name: Re-capture authoritative evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          ./scripts/capture-autorelease-evidence --output release-run/evidence
          ./autorelease/control.py validate-recaptured-evidence \
            --plan admitted-run/autorelease-plan.json \
            --admitted-manifest admitted-run/evidence/evidence-manifest.json \
            --current-manifest release-run/evidence/evidence-manifest.json
      - name: Verify cross-repository readiness when required
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          action="$(jq -r .action admitted-run/autorelease-plan.json)"
          if [[ "$action" == "new_branch" ]]; then
            filename="$(printf '%s' "$ACTION_KEY" | tr ':/' '--').json"
            event="autorelease-events/$filename"
            test -f "$event"
            test "$(jq -r .state "$event")" = "php_bin_ready"
            gh api "repos/bigpixelrocket/mise-php/contents/readiness/$filename?ref=main" \
              --jq .content | base64 --decode > release-run/mise-readiness.json
            test "$(jq -r .actionKey release-run/mise-readiness.json)" = "$ACTION_KEY"
            test "$(jq -r .ready release-run/mise-readiness.json)" = "true"
            test "$(jq -r .policyDigest release-run/mise-readiness.json)" = "$(jq -r .supportPolicyDigest "$event")"
            test "$(jq -r .policyInvariantsDigest release-run/mise-readiness.json)" = "$(jq -r .policyInvariantsDigest "$event")"
            policy_commit="$(jq -r .phpBinPolicyCommit release-run/mise-readiness.json)"
            test "$(jq -r .misePhpCommit release-run/mise-readiness.json)" = "$(git -C mise-php rev-parse HEAD)"
            gh api "repos/${{ github.repository }}/contents/support-policy.json?ref=$policy_commit" \
              --jq .content | base64 --decode > release-run/readiness-policy.json
            test "sha256:$(shasum -a 256 release-run/readiness-policy.json | awk '{print $1}')" = "$(jq -r .policyDigest release-run/mise-readiness.json)"
          fi
      - name: Reconcile existing immutable release assets
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .artifacts
          if gh release view "$VERSION" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release download "$VERSION" --repo "${{ github.repository }}" --dir .artifacts
            ./scripts/validate-autorelease-archive \
              --archive ".artifacts/php-$VERSION-cli-macos-aarch64.tar.gz" \
              --version "$VERSION"
            archive_digest="$(shasum -a 256 ".artifacts/php-$VERSION-cli-macos-aarch64.tar.gz" | awk '{print $1}')"
            grep -Fx "$archive_digest  php-$VERSION-cli-macos-aarch64.tar.gz" .artifacts/SHA256SUMS
            echo "reuse=true" >> "$GITHUB_OUTPUT"
          else
            echo "reuse=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install build dependencies
        if: steps.existing.outputs.reuse != 'true'
        run: ./scripts/install-build-deps.sh
      - name: Install pinned StaticPHP
        if: steps.existing.outputs.reuse != 'true'
        run: ./scripts/install-spc.sh
      - name: Build exact patch
        if: steps.existing.outputs.reuse != 'true'
        run: ./scripts/build.sh "$VERSION" s4
      - name: Package and validate staged bytes
        if: steps.existing.outputs.reuse != 'true'
        run: |
          ./scripts/package.sh ".build/$VERSION/s4/buildroot/bin/php" "$VERSION"
          ./scripts/validate-autorelease-archive \
            --archive ".artifacts/php-$VERSION-cli-macos-aarch64.tar.gz" \
            --version "$VERSION"
      - name: Initialize release transaction and event
        run: |
          mkdir -p release-run
          printf '{"schemaVersion":1,"state":"requested","history":[]}\n' > release-run/transaction.json
          filename="$(printf '%s' "$ACTION_KEY" | tr ':/' '--').json"
          if [[ -f "autorelease-events/$filename" ]]; then
            cp "autorelease-events/$filename" release-run/event.json
            if [[ "$(jq -r .state release-run/event.json)" == "php_bin_ready" \
              && "$(jq -r .action admitted-run/autorelease-plan.json)" == "new_branch" ]]; then
              jq -n --slurpfile ready release-run/mise-readiness.json \
                '[{kind:"mise_readiness",record:$ready[0]}]' > release-run/evidence.json
              ./scripts/autorelease-event --event release-run/event.json --target mise_ready \
                --evidence release-run/evidence.json --output release-run/next-event.json
              mv release-run/next-event.json release-run/event.json
            fi
            jq -n --arg planDigest "$(jq -r .planDigest admitted-run/admission.json)" \
              '[{kind:"admitted_release_intent",planDigest:$planDigest}]' > release-run/evidence.json
            ./scripts/autorelease-event --event release-run/event.json --target release_requested \
              --evidence release-run/evidence.json --output release-run/next-event.json
            mv release-run/next-event.json release-run/event.json
          else
            jq -n \
              --arg actionKey "$ACTION_KEY" \
              --arg classification "$(jq -r .action admitted-run/autorelease-plan.json)" \
              --arg commit "$EXACT_COMMIT" \
              --arg planDigest "$(jq -r .planDigest admitted-run/admission.json)" \
              --arg evidenceManifestDigest "$(jq -r .manifestDigest admitted-run/evidence/evidence-manifest.json)" \
              --argjson evidenceDigests "$(jq '[.evidence[].digest]' admitted-run/autorelease-plan.json)" \
              '{schemaVersion:1,actionKey:$actionKey,classification:$classification,state:"release_requested",history:[],phpBinCommit:$commit,planDigest:$planDigest,evidenceManifestDigest:$evidenceManifestDigest,evidenceDigests:$evidenceDigests}' \
              > release-run/event.json
          fi
      - name: Advance through build and draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/contents/.github/autorelease-operator.json?ref=main" \
            --jq .content | base64 --decode > release-run/current-operator.json
          test "$(jq -r .unattendedMutation release-run/current-operator.json)" = "enabled"
          for target in built draft_created draft_verified; do
            ./scripts/publish-release \
              --transaction release-run/transaction.json \
              --target "$target" \
              --assets .artifacts \
              --version "$VERSION" \
              --commit "$EXACT_COMMIT" \
              --backend github \
              --repo "${{ github.repository }}" \
              --output release-run/next.json
            mv release-run/next.json release-run/transaction.json
          done
      - name: Verify draft installation through temporary artifact path
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          temporary="$(mktemp -d)"
          gh release download "$VERSION" --repo "${{ github.repository }}" --dir "$temporary"
          port="$(python3 -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1",0)); print(s.getsockname()[1]); s.close()')"
          ./scripts/serve-autorelease-artifact --port "$port" --assets "$temporary" --version "$VERSION" &
          server_pid="$!"
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for _ in {1..50}; do
            if curl --silent --fail "http://127.0.0.1:$port/health"; then
              ready=true
              break
            fi
            sleep 0.1
          done
          "$ready" || { echo "staged artifact server did not become healthy" >&2; exit 1; }
          export MISE_PHP_API_BASE_URL="http://127.0.0.1:$port"
          export MISE_DATA_DIR="$temporary/mise/data"
          export MISE_CACHE_DIR="$temporary/mise/cache"
          export MISE_CONFIG_DIR="$temporary/mise/config"
          export MISE_STATE_DIR="$temporary/mise/state"
          mise plugin link php "$GITHUB_WORKSPACE/mise-php"
          mise install "php@$VERSION"
          mise exec "php@$VERSION" -- php -v
          mise exec "php@$VERSION" -- php -m | grep -Fx Core
          kill "$server_pid"
          wait "$server_pid" || true
          trap - EXIT
      - name: Publish unchanged draft and verify public bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/contents/.github/autorelease-operator.json?ref=main" \
            --jq .content | base64 --decode > release-run/current-operator.json
          test "$(jq -r .unattendedMutation release-run/current-operator.json)" = "enabled"
          for target in published public_verified complete; do
            ./scripts/publish-release \
              --transaction release-run/transaction.json \
              --target "$target" \
              --assets .artifacts \
              --version "$VERSION" \
              --commit "$EXACT_COMMIT" \
              --backend github \
              --repo "${{ github.repository }}" \
              --output release-run/next.json
            mv release-run/next.json release-run/transaction.json
          done
          test "$(gh release view "$VERSION" --repo "${{ github.repository }}" --json isImmutable --jq .isImmutable)" = "true"
          verified=false
          for _ in {1..12}; do
            if gh release verify "$VERSION" --repo "${{ github.repository }}" --format json \
              > release-run/release-attestation.json; then
              verified=true
              break
            fi
            sleep 5
          done
          test "$verified" = "true"
      - name: Verify fresh public exact-version and branch-shorthand installs
        run: |
          unset MISE_PHP_API_BASE_URL
          temporary="$(mktemp -d)"
          export MISE_DATA_DIR="$temporary/data"
          export MISE_CACHE_DIR="$temporary/cache"
          export MISE_CONFIG_DIR="$temporary/config"
          export MISE_STATE_DIR="$temporary/state"
          branch="$VERSION"
          branch="${branch%%-*}"
          branch="${branch%.*}"
          mise plugin link php "$GITHUB_WORKSPACE/mise-php"
          mise install "php@$VERSION"
          mise install "php@$branch"
          mise exec "php@$VERSION" -- php -v
          mise exec "php@$branch" -- php -v
      - name: Complete durable event
        run: |
          jq -n --arg version "$VERSION" --argjson assets "$(jq .assetDigests release-run/transaction.json)" \
            '[{kind:"published_release",version:$version,assetDigests:$assets}]' > release-run/evidence.json
          ./scripts/autorelease-event --event release-run/event.json --target released \
            --evidence release-run/evidence.json --output release-run/next-event.json
          mv release-run/next-event.json release-run/event.json
          jq -n --arg version "$VERSION" \
            '[{kind:"fresh_public_mise_installs",version:$version,modes:["exact","branch_shorthand"]}]' > release-run/evidence.json
          ./scripts/autorelease-event --event release-run/event.json --target public_install_verified \
            --evidence release-run/evidence.json --output release-run/next-event.json
          mv release-run/next-event.json release-run/event.json
          jq -n '[{kind:"transaction_complete"}]' > release-run/evidence.json
          ./scripts/autorelease-event --event release-run/event.json --target complete \
            --evidence release-run/evidence.json --output release-run/next-event.json
          mv release-run/next-event.json release-run/event.json
          jq --arg version "$VERSION" \
            '.severity="info" | .summary="PHP \($version) was published and verified through fresh exact and branch-shorthand mise installs." | .finalResult="passed"' \
            release-run/event.json > release-run/notification-event.json
      - name: Commit final event record through a checked PR
        id: event_pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main
          git checkout -B "autorelease/event-${{ github.run_id }}" origin/main
          base="$(git rev-parse HEAD)"
          filename="$(printf '%s' "$ACTION_KEY" | tr ':/' '--').json"
          cp release-run/event.json "autorelease-events/$filename"
          git add "autorelease-events/$filename"
          git -c user.name=autorelease -c user.email=autorelease@invalid \
            commit -m "chore: complete $ACTION_KEY"
          head="$(git rev-parse HEAD)"
          record="autorelease-events/$filename"
          digest="sha256:$(shasum -a 256 "$record" | awk '{print $1}')"
          gh auth setup-git
          git push origin HEAD
          url="$(gh pr create --base main --head "autorelease/event-${{ github.run_id }}" \
            --title "chore: complete $ACTION_KEY" \
            --body "Durable event record for the immutable verified release transaction.")"
          echo "number=${url##*/}" >> "$GITHUB_OUTPUT"
          echo "base_sha=$base" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head" >> "$GITHUB_OUTPUT"
          echo "record=$record" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Validate and merge final event record
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/dispatch-pr-checks \
            --pr "${{ steps.event_pr.outputs.number }}" \
            --check "Script checks" \
            --output release-run/event-checks.json
          ./scripts/assert-admission-checks --checks release-run/event-checks.json
          actual="$(gh pr view "${{ steps.event_pr.outputs.number }}" --json headRefOid --jq .headRefOid)"
          test "$actual" = "${{ steps.event_pr.outputs.head_sha }}"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "${{ steps.event_pr.outputs.base_sha }}"
          test "$(git rev-list --parents -n 1 "$actual")" = "$actual ${{ steps.event_pr.outputs.base_sha }}"
          test "$(git diff --name-only "${{ steps.event_pr.outputs.base_sha }}" "$actual")" = "${{ steps.event_pr.outputs.record }}"
          test "sha256:$(git show "$actual:${{ steps.event_pr.outputs.record }}" | shasum -a 256 | awk '{print $1}')" = "${{ steps.event_pr.outputs.digest }}"
          gh pr merge "${{ steps.event_pr.outputs.number }}" --squash --delete-branch
      - name: Notify owner of completed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/notify-autorelease \
            --event release-run/notification-event.json \
            --state release-run/notification-state.json \
            --output release-run/notification-next.json \
            --backend github \
            --repo "${{ github.repository }}" \
            --owner "${{ vars.AUTORELEASE_OWNER }}"
      - name: Record release failure diagnostic
        if: failure()
        run: |
          mkdir -p release-run
          jq -n \
            --arg actionKey "$ACTION_KEY" \
            --arg version "$VERSION" \
            --arg exactCommit "$EXACT_COMMIT" \
            --arg investigationRunId "$INVESTIGATION_RUN_ID" \
            --arg releaseRunId "${{ github.run_id }}" \
            --arg runUrl "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{schemaVersion:1,actionKey:$actionKey,version:$version,exactCommit:$exactCommit,investigationRunId:$investigationRunId,releaseRunId:$releaseRunId,state:"failed",runUrl:$runUrl}' \
            > release-run/failure.json
      - name: Retain transaction and exact staging bytes
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-transaction-${{ needs.preflight.outputs.version }}-${{ github.run_id }}
          path: |
            .artifacts/
            release-run/
          if-no-files-found: error
          retention-days: 90
          include-hidden-files: true

  notify-failure:
    name: Notify actionable release failure
    needs: [preflight, release]
    # A skipped release already keeps this job quiet when preflight rejects the
    # dispatch, but the preflight result is asserted anyway so the gate survives
    # a later change to the release job's own condition.
    if: always() && needs.preflight.result == 'success' && needs.release.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Create structured critical event
        env:
          ACTION_KEY: ${{ needs.preflight.outputs.action_key }}
          VERSION: ${{ needs.preflight.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          jq -n \
            --arg actionKey "$ACTION_KEY" \
            --arg summary "Autorelease failed for PHP $VERSION: $RUN_URL" \
            --arg failureFingerprint "release-failure:$ACTION_KEY" \
            '{actionKey:$actionKey,state:"blocked",severity:"critical",humanActionRequired:false,summary:$summary,failureFingerprint:$failureFingerprint}' \
            > event.json
      - name: Notify owner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/notify-autorelease \
            --event event.json \
            --state notification-state.json \
            --output notification.json \
            --backend github \
            --repo "${{ github.repository }}" \
            --owner "${{ vars.AUTORELEASE_OWNER }}"
