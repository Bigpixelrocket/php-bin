name: Autorelease publish transaction

on:
  workflow_dispatch:
    inputs:
      version:
        description: Admitted stable PHP patch or rebuild tag
        required: true
        type: string
      exact_commit:
        description: Exact admitted merged php-bin commit
        required: true
        type: string
      action_key:
        description: Exact admitted autorelease action key
        required: true
        type: string
      investigation_run_id:
        description: Run containing retained admitted evidence and plan
        required: true
        type: string

permissions:
  contents: write
  issues: write
  actions: write
  checks: write
  pull-requests: write
  statuses: write

concurrency:
  group: autorelease-publish-${{ inputs.version }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  # Dispatch inputs reach actions/checkout and many run scripts. They are shaped
  # once here, ahead of every other job, and republished as outputs so no raw
  # inputs expression is expanded anywhere downstream.
  preflight:
    name: Validate dispatch inputs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.validated.outputs.version }}
      exact_commit: ${{ steps.validated.outputs.exact_commit }}
      action_key: ${{ steps.validated.outputs.action_key }}
      investigation_run_id: ${{ steps.validated.outputs.investigation_run_id }}
    steps:
      - name: Enforce exact input shapes
        id: validated
        env:
          VERSION: ${{ inputs.version }}
          EXACT_COMMIT: ${{ inputs.exact_commit }}
          ACTION_KEY: ${{ inputs.action_key }}
          INVESTIGATION_RUN_ID: ${{ inputs.investigation_run_id }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[1-9][0-9]*)?$ ]]
          [[ "$EXACT_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ACTION_KEY" =~ ^[A-Za-z0-9._:-]+$ ]]
          [[ "$INVESTIGATION_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          {
            echo "version=$VERSION"
            echo "exact_commit=$EXACT_COMMIT"
            echo "action_key=$ACTION_KEY"
            echo "investigation_run_id=$INVESTIGATION_RUN_ID"
          } >> "$GITHUB_OUTPUT"

  # StaticPHP resolves most sources through the GitHub API, which rate limits
  # anonymous calls from shared macOS runners, and it runs third-party build
  # scripts. The build therefore runs here, on its own runner with a read-only
  # token, so the release job's write token never shares a process, an
  # environment, or a disk with it. The release job accepts only this job's
  # artifact, by ID, service digest, and the file digests reported below.
  build:
    name: Build exact patch
    needs: preflight
    runs-on: macos-26
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      EXACT_COMMIT: ${{ needs.preflight.outputs.exact_commit }}
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      archive_digest: ${{ steps.staged.outputs.archive_digest }}
      checksums_digest: ${{ steps.staged.outputs.checksums_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.preflight.outputs.exact_commit }}
          persist-credentials: false
      - name: Verify exact commit and runner architecture
        run: |
          test "$(git rev-parse HEAD)" = "$EXACT_COMMIT"
          test "$(uname -s)" = Darwin && test "$(uname -m)" = arm64
      - name: Install build dependencies
        run: ./scripts/install-build-deps.sh
      - name: Install pinned StaticPHP
        run: ./scripts/install-spc.sh
      - name: Build exact patch
        env:
          # StaticPHP authenticates GitHub API calls only through this variable.
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/build.sh "$VERSION" s4
      - name: Package and validate staged bytes
        id: staged
        run: |
          archive=".artifacts/php-$VERSION-cli-macos-aarch64.tar.gz"
          ./scripts/package.sh ".build/$VERSION/s4/buildroot/bin/php" "$VERSION"
          ./scripts/validate-autorelease-archive --archive "$archive" --version "$VERSION"
          {
            echo "archive_digest=sha256:$(shasum -a 256 "$archive" | awk '{print $1}')"
            echo "checksums_digest=sha256:$(shasum -a 256 .artifacts/SHA256SUMS | awk '{print $1}')"
          } >> "$GITHUB_OUTPUT"
      - name: Hand the staged bytes to the release job
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/
          if-no-files-found: error
          retention-days: 90
          include-hidden-files: true


  # The release transaction runs in three write-scoped jobs, and nothing the built
  # binary could touch reaches any of them. This first one alone decides whether an
  # existing release is reconciled: only the write token can see a draft, and that
  # path reuses the release's own assets and never needs the build. It therefore runs
  # even when the build failed, so a draft left by an earlier run can still be
  # completed, while a fresh release stops at "Require the isolated build" before any
  # effect. It ends at a verified draft and hands the draft bytes, the transaction, and
  # the event over by artifact ID and digest.
  release:
    name: Stage and verify the draft
    needs: [preflight, build]
    if: ${{ !cancelled() && needs.preflight.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: php-autorelease-publish
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      EXACT_COMMIT: ${{ needs.preflight.outputs.exact_commit }}
      ACTION_KEY: ${{ needs.preflight.outputs.action_key }}
      INVESTIGATION_RUN_ID: ${{ needs.preflight.outputs.investigation_run_id }}
    outputs:
      mise_commit: ${{ steps.plugin.outputs.commit }}
      handoff_artifact_id: ${{ steps.handoff.outputs.artifact-id }}
      transaction_digest: ${{ steps.handoff_digests.outputs.transaction_digest }}
      event_digest: ${{ steps.handoff_digests.outputs.event_digest }}
      archive_digest: ${{ steps.handoff_digests.outputs.archive_digest }}
      checksums_digest: ${{ steps.handoff_digests.outputs.checksums_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.preflight.outputs.exact_commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Download admitted plan and retained evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$INVESTIGATION_RUN_ID" \
            --name "autorelease-investigation-$INVESTIGATION_RUN_ID" \
            --dir admitted-run
      - name: Verify stable version and exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./autorelease/control.py validate-policy
          test "$(git rev-parse HEAD)" = "$EXACT_COMMIT"
          test "$(jq -r .actionKey admitted-run/autorelease-plan.json)" = "$ACTION_KEY"
          test "$(jq -r .releaseIntent.version admitted-run/autorelease-plan.json)" = "$VERSION"
          test "$(jq -r .preconditions.phpBinHead admitted-run/autorelease-plan.json)" = "$EXACT_COMMIT"
          test "$(jq -r .preconditions.supportPolicyDigest admitted-run/autorelease-plan.json)" = "$(./autorelease/control.py digest support-policy.json)"
          ./autorelease/control.py operator-gate --operator-file .github/autorelease-operator.json --require-enabled
          mkdir -p release-run
          gh api "repos/${{ github.repository }}/contents/.github/autorelease-operator.json?ref=main" \
            --jq .content | base64 --decode > release-run/current-operator.json
          ./autorelease/control.py operator-gate --operator-file release-run/current-operator.json --require-enabled
      - name: Re-capture authoritative evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          ./scripts/capture-autorelease-evidence --output release-run/evidence
          ./autorelease/control.py validate-recaptured-evidence \
            --plan admitted-run/autorelease-plan.json \
            --admitted-manifest admitted-run/evidence/evidence-manifest.json \
            --current-manifest release-run/evidence/evidence-manifest.json
      - name: Select the mise-php commit installs are verified with
        id: plugin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mise_commit="$(jq -r .sha admitted-run/evidence/raw/mise_php_state.body)"
          [[ "$mise_commit" =~ ^[0-9a-f]{40}$ ]]
          action="$(jq -r .action admitted-run/autorelease-plan.json)"
          if [[ "$action" == "new_branch" ]]; then
            filename="$(./autorelease/control.py action-filename "$ACTION_KEY")"
            event="autorelease-events/$filename"
            test -f "$event"
            test "$(jq -r .state "$event")" = "php_bin_ready"
            gh api "repos/bigpixelrocket/mise-php/contents/readiness/$filename?ref=main" \
              --jq .content | base64 --decode > release-run/mise-readiness.json
            test "$(jq -r .actionKey release-run/mise-readiness.json)" = "$ACTION_KEY"
            test "$(jq -r .ready release-run/mise-readiness.json)" = "true"
            test "$(jq -r .policyDigest release-run/mise-readiness.json)" = "$(jq -r .supportPolicyDigest "$event")"
            test "$(jq -r .policyInvariantsDigest release-run/mise-readiness.json)" = "$(jq -r .policyInvariantsDigest "$event")"
            policy_commit="$(jq -r .phpBinPolicyCommit release-run/mise-readiness.json)"
            # mise-php merges its readiness record on top of the synchronization commit
            # the record names, so the captured main is that commit or a descendant of
            # it. The plugin is then verified at exactly the commit readiness validated.
            ready_commit="$(jq -r .misePhpCommit release-run/mise-readiness.json)"
            [[ "$ready_commit" =~ ^[0-9a-f]{40}$ ]]
            ancestry="$(gh api "repos/bigpixelrocket/mise-php/compare/$ready_commit...$mise_commit" --jq .status)"
            [[ "$ancestry" == "identical" || "$ancestry" == "ahead" ]]
            mise_commit="$ready_commit"
            gh api "repos/${{ github.repository }}/contents/support-policy.json?ref=$policy_commit" \
              --jq .content | base64 --decode > release-run/readiness-policy.json
            test "sha256:$(shasum -a 256 release-run/readiness-policy.json | awk '{print $1}')" = "$(jq -r .policyDigest release-run/mise-readiness.json)"
          fi
          echo "commit=$mise_commit" >> "$GITHUB_OUTPUT"
      - name: Reconcile existing immutable release assets
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .artifacts
          if gh release view "$VERSION" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release download "$VERSION" --repo "${{ github.repository }}" --dir .artifacts
            ./scripts/validate-autorelease-archive \
              --archive ".artifacts/php-$VERSION-cli-macos-aarch64.tar.gz" \
              --version "$VERSION"
            archive_digest="$(shasum -a 256 ".artifacts/php-$VERSION-cli-macos-aarch64.tar.gz" | awk '{print $1}')"
            grep -Fx "$archive_digest  php-$VERSION-cli-macos-aarch64.tar.gz" .artifacts/SHA256SUMS
            echo "reuse=true" >> "$GITHUB_OUTPUT"
          else
            echo "reuse=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Require the isolated build
        if: steps.existing.outputs.reuse != 'true'
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
          ARCHIVE_DIGEST: ${{ needs.build.outputs.archive_digest }}
          CHECKSUMS_DIGEST: ${{ needs.build.outputs.checksums_digest }}
        run: |
          test "$BUILD_RESULT" = success
          # An empty ID would make the download below fetch every artifact of the run.
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$ARCHIVE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$CHECKSUMS_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
      - name: Download the isolated build
        if: steps.existing.outputs.reuse != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: .artifacts
          digest-mismatch: error
      - name: Verify the staged bytes the build reported
        if: steps.existing.outputs.reuse != 'true'
        env:
          ARCHIVE_DIGEST: ${{ needs.build.outputs.archive_digest }}
          CHECKSUMS_DIGEST: ${{ needs.build.outputs.checksums_digest }}
        run: |
          archive="php-$VERSION-cli-macos-aarch64.tar.gz"
          test "$(find .artifacts -mindepth 1 -print | LC_ALL=C sort | paste -sd ' ' -)" \
            = ".artifacts/SHA256SUMS .artifacts/$archive"
          archive_hex="$(shasum -a 256 ".artifacts/$archive" | awk '{print $1}')"
          test "sha256:$archive_hex" = "$ARCHIVE_DIGEST"
          test "sha256:$(shasum -a 256 .artifacts/SHA256SUMS | awk '{print $1}')" = "$CHECKSUMS_DIGEST"
          grep -Fx "$archive_hex  $archive" .artifacts/SHA256SUMS
          ./scripts/validate-autorelease-archive --archive ".artifacts/$archive" --version "$VERSION"
      - name: Initialize release transaction and event
        run: |
          mkdir -p release-run
          printf '{"schemaVersion":1,"state":"requested","history":[]}\n' > release-run/transaction.json
          filename="$(./autorelease/control.py action-filename "$ACTION_KEY")"
          if [[ -f "autorelease-events/$filename" ]]; then
            cp "autorelease-events/$filename" release-run/event.json
            if [[ "$(jq -r .state release-run/event.json)" == "php_bin_ready" \
              && "$(jq -r .action admitted-run/autorelease-plan.json)" == "new_branch" ]]; then
              jq -n --slurpfile ready release-run/mise-readiness.json \
                '[{kind:"mise_readiness",record:$ready[0]}]' > release-run/evidence.json
              ./scripts/autorelease-event --event release-run/event.json --target mise_ready \
                --evidence release-run/evidence.json --output release-run/next-event.json
              mv release-run/next-event.json release-run/event.json
            fi
            jq -n --arg planDigest "$(jq -r .planDigest admitted-run/admission.json)" \
              '[{kind:"admitted_release_intent",planDigest:$planDigest}]' > release-run/evidence.json
            ./scripts/autorelease-event --event release-run/event.json --target release_requested \
              --evidence release-run/evidence.json --output release-run/next-event.json
            mv release-run/next-event.json release-run/event.json
          else
            jq -n \
              --arg actionKey "$ACTION_KEY" \
              --arg classification "$(jq -r .action admitted-run/autorelease-plan.json)" \
              --arg commit "$EXACT_COMMIT" \
              --arg planDigest "$(jq -r .planDigest admitted-run/admission.json)" \
              --arg evidenceManifestDigest "$(jq -r .manifestDigest admitted-run/evidence/evidence-manifest.json)" \
              --argjson evidenceDigests "$(jq '[.evidence[].digest]' admitted-run/autorelease-plan.json)" \
              '{schemaVersion:1,actionKey:$actionKey,classification:$classification,state:"release_requested",history:[],phpBinCommit:$commit,planDigest:$planDigest,evidenceManifestDigest:$evidenceManifestDigest,evidenceDigests:$evidenceDigests}' \
              > release-run/event.json
          fi
      - name: Advance through build and draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/contents/.github/autorelease-operator.json?ref=main" \
            --jq .content | base64 --decode > release-run/current-operator.json
          ./autorelease/control.py operator-gate --operator-file release-run/current-operator.json --require-enabled
          for target in built draft_created draft_verified; do
            ./scripts/publish-release \
              --transaction release-run/transaction.json \
              --target "$target" \
              --assets .artifacts \
              --version "$VERSION" \
              --commit "$EXACT_COMMIT" \
              --backend github \
              --repo "${{ github.repository }}" \
              --output release-run/next.json
            mv release-run/next.json release-run/transaction.json
          done
      # Only the write token can read a draft, so this job downloads it and hands the
      # exact draft bytes to the read-only job that installs them.
      - name: Download the draft assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-handoff/draft
          gh release download "$VERSION" --repo "${{ github.repository }}" --dir release-handoff/draft
          archive="php-$VERSION-cli-macos-aarch64.tar.gz"
          test "$(find release-handoff/draft -mindepth 1 -print | LC_ALL=C sort | paste -sd ' ' -)" \
            = "release-handoff/draft/SHA256SUMS release-handoff/draft/$archive"
          for name in "$archive" SHA256SUMS; do
            test "sha256:$(shasum -a 256 "release-handoff/draft/$name" | awk '{print $1}')" \
              = "$(jq -r --arg name "$name" '.assetDigests[$name]' release-run/transaction.json)"
          done
          test "$(jq -r .state release-run/transaction.json)" = "draft_verified"
          cp release-run/transaction.json release-run/event.json release-handoff/
      - name: Record the handed-over digests
        id: handoff_digests
        run: |
          archive="php-$VERSION-cli-macos-aarch64.tar.gz"
          {
            echo "transaction_digest=sha256:$(shasum -a 256 release-handoff/transaction.json | awk '{print $1}')"
            echo "event_digest=sha256:$(shasum -a 256 release-handoff/event.json | awk '{print $1}')"
            echo "archive_digest=sha256:$(shasum -a 256 "release-handoff/draft/$archive" | awk '{print $1}')"
            echo "checksums_digest=sha256:$(shasum -a 256 release-handoff/draft/SHA256SUMS | awk '{print $1}')"
          } >> "$GITHUB_OUTPUT"
      - name: Hand the verified draft to the next jobs
        id: handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-draft-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-handoff/
          if-no-files-found: error
          retention-days: 90
      - name: Record release failure diagnostic
        if: failure()
        run: |
          mkdir -p release-run
          jq -n \
            --arg actionKey "$ACTION_KEY" \
            --arg version "$VERSION" \
            --arg exactCommit "$EXACT_COMMIT" \
            --arg investigationRunId "$INVESTIGATION_RUN_ID" \
            --arg releaseRunId "${{ github.run_id }}" \
            --arg runUrl "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{schemaVersion:1,actionKey:$actionKey,version:$version,exactCommit:$exactCommit,investigationRunId:$investigationRunId,releaseRunId:$releaseRunId,state:"failed",runUrl:$runUrl}' \
            > release-run/failure.json
      - name: Retain transaction and exact staging bytes
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-transaction-${{ needs.preflight.outputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .artifacts/
            release-run/
          if-no-files-found: error
          retention-days: 90
          include-hidden-files: true

  # The built binary runs only in the two install checks, each in a job whose token
  # can only read contents and that holds no environment. The token authenticates the
  # plugin's GitHub API reads, which anonymous shared runners lose to rate limits.
  verify-draft:
    name: Verify the draft through a temporary install
    needs: [preflight, release]
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.preflight.outputs.exact_commit }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: bigpixelrocket/mise-php
          ref: ${{ needs.release.outputs.mise_commit }}
          path: mise-php
          persist-credentials: false
      # mise installs no tools here. Without the cache it never runs a mise binary
      # another job could have saved.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          github_token: ${{ github.token }}
          cache: false
      - name: Download the draft bytes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.release.outputs.handoff_artifact_id }}
          path: release-handoff
          digest-mismatch: error
      - name: Verify the draft bytes the release job reported
        env:
          ARCHIVE_DIGEST: ${{ needs.release.outputs.archive_digest }}
          CHECKSUMS_DIGEST: ${{ needs.release.outputs.checksums_digest }}
        run: |
          archive="php-$VERSION-cli-macos-aarch64.tar.gz"
          test "$(find release-handoff/draft -mindepth 1 -print | LC_ALL=C sort | paste -sd ' ' -)" \
            = "release-handoff/draft/SHA256SUMS release-handoff/draft/$archive"
          test "sha256:$(shasum -a 256 "release-handoff/draft/$archive" | awk '{print $1}')" = "$ARCHIVE_DIGEST"
          test "sha256:$(shasum -a 256 release-handoff/draft/SHA256SUMS | awk '{print $1}')" = "$CHECKSUMS_DIGEST"
          ./scripts/validate-autorelease-archive --archive "release-handoff/draft/$archive" --version "$VERSION"
      - name: Verify draft installation through temporary artifact path
        run: |
          temporary="$RUNNER_TEMP/draft-install"
          mkdir -p "$temporary"
          port="$(python3 -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1",0)); print(s.getsockname()[1]); s.close()')"
          ./scripts/serve-autorelease-artifact --port "$port" --assets release-handoff/draft --version "$VERSION" &
          server_pid="$!"
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for _ in {1..50}; do
            if curl --silent --fail "http://127.0.0.1:$port/health"; then
              ready=true
              break
            fi
            sleep 0.1
          done
          "$ready" || { echo "staged artifact server did not become healthy" >&2; exit 1; }
          export MISE_PHP_API_BASE_URL="http://127.0.0.1:$port"
          export MISE_DATA_DIR="$temporary/mise/data"
          export MISE_CACHE_DIR="$temporary/mise/cache"
          export MISE_CONFIG_DIR="$temporary/mise/config"
          export MISE_STATE_DIR="$temporary/mise/state"
          mise plugin link php "$GITHUB_WORKSPACE/mise-php"
          mise install "php@$VERSION"
          mise exec "php@$VERSION" -- php -v
          mise exec "php@$VERSION" -- php -m | grep -Fx Core
          kill "$server_pid"
          wait "$server_pid" || true
          trap - EXIT

  # Publication resumes the transaction the release job handed over, only after the
  # draft install passed. It re-reads the draft once more (`publishing`) immediately
  # before the irreversible publication.
  publish:
    name: Publish the verified draft
    needs: [preflight, release, verify-draft]
    if: ${{ !cancelled() && needs.release.result == 'success' && needs['verify-draft'].result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: php-autorelease-publish
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      EXACT_COMMIT: ${{ needs.preflight.outputs.exact_commit }}
    outputs:
      handoff_artifact_id: ${{ steps.handoff.outputs.artifact-id }}
      transaction_digest: ${{ steps.handoff_digests.outputs.transaction_digest }}
      event_digest: ${{ steps.handoff_digests.outputs.event_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.preflight.outputs.exact_commit }}
          persist-credentials: false
      - name: Download the verified draft transaction
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.release.outputs.handoff_artifact_id }}
          path: release-handoff
          digest-mismatch: error
      - name: Verify the handed-over transaction
        env:
          TRANSACTION_DIGEST: ${{ needs.release.outputs.transaction_digest }}
          EVENT_DIGEST: ${{ needs.release.outputs.event_digest }}
          ARCHIVE_DIGEST: ${{ needs.release.outputs.archive_digest }}
          CHECKSUMS_DIGEST: ${{ needs.release.outputs.checksums_digest }}
        run: |
          archive="php-$VERSION-cli-macos-aarch64.tar.gz"
          test "$(find release-handoff -type f -print | LC_ALL=C sort | paste -sd ' ' -)" \
            = "release-handoff/draft/SHA256SUMS release-handoff/draft/$archive release-handoff/event.json release-handoff/transaction.json"
          test "sha256:$(shasum -a 256 release-handoff/transaction.json | awk '{print $1}')" = "$TRANSACTION_DIGEST"
          test "sha256:$(shasum -a 256 release-handoff/event.json | awk '{print $1}')" = "$EVENT_DIGEST"
          test "sha256:$(shasum -a 256 "release-handoff/draft/$archive" | awk '{print $1}')" = "$ARCHIVE_DIGEST"
          test "sha256:$(shasum -a 256 release-handoff/draft/SHA256SUMS | awk '{print $1}')" = "$CHECKSUMS_DIGEST"
          test "$(jq -r .state release-handoff/transaction.json)" = "draft_verified"
          test "$(jq -r .version release-handoff/transaction.json)" = "$VERSION"
          test "$(jq -r .commit release-handoff/transaction.json)" = "$EXACT_COMMIT"
          mkdir -p release-run
          cp release-handoff/transaction.json release-handoff/event.json release-run/
      # A rerun of the failed jobs reuses the release job's handoff without repeating its
      # recapture, however long ago that ran. While the release is still a draft the
      # admitted evidence is therefore recaptured and revalidated here, supersession
      # included. A release that is already public only completes its transaction.
      - name: Re-capture authoritative evidence before publication
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          INVESTIGATION_RUN_ID: ${{ needs.preflight.outputs.investigation_run_id }}
        run: |
          is_draft="$(gh release view "$VERSION" --repo "${{ github.repository }}" --json isDraft --jq .isDraft)"
          if [[ "$is_draft" == "true" ]]; then
            gh run download "$INVESTIGATION_RUN_ID" \
              --name "autorelease-investigation-$INVESTIGATION_RUN_ID" \
              --dir admitted-run
            ./scripts/capture-autorelease-evidence --output release-run/evidence
            ./autorelease/control.py validate-recaptured-evidence \
              --plan admitted-run/autorelease-plan.json \
              --admitted-manifest admitted-run/evidence/evidence-manifest.json \
              --current-manifest release-run/evidence/evidence-manifest.json
          else
            test "$is_draft" = "false"
          fi
      - name: Publish unchanged draft and verify public bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/contents/.github/autorelease-operator.json?ref=main" \
            --jq .content | base64 --decode > release-run/current-operator.json
          ./autorelease/control.py operator-gate --operator-file release-run/current-operator.json --require-enabled
          for target in publishing published public_verified complete; do
            ./scripts/publish-release \
              --transaction release-run/transaction.json \
              --target "$target" \
              --assets release-handoff/draft \
              --version "$VERSION" \
              --commit "$EXACT_COMMIT" \
              --backend github \
              --repo "${{ github.repository }}" \
              --output release-run/next.json
            mv release-run/next.json release-run/transaction.json
          done
          test "$(gh release view "$VERSION" --repo "${{ github.repository }}" --json isImmutable --jq .isImmutable)" = "true"
          verified=false
          for _ in {1..12}; do
            if gh release verify "$VERSION" --repo "${{ github.repository }}" --format json \
              > release-run/release-attestation.json; then
              verified=true
              break
            fi
            sleep 5
          done
          test "$verified" = "true"
      - name: Record whether the immutable release is live
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-run
          released=false
          state=""
          if [[ -f release-run/transaction.json ]]; then
            state="$(jq -r .state release-run/transaction.json)"
          fi
          is_draft="$(gh release view "$VERSION" --repo "${{ github.repository }}" --json isDraft --jq .isDraft 2>/dev/null || true)"
          case "$state" in
            published|public_verified|complete) released=true ;;
            # The run stopped between publication and its record, so the release
            # counts as live unless GitHub positively reports it is still a draft.
            publishing)
              released=true
              if [[ "$is_draft" == "true" ]]; then
                released=false
              fi
              ;;
            # A rerun resumes from the draft handoff even when an earlier attempt already
            # published, so a release GitHub reports as public is live whatever this
            # attempt recorded before it stopped.
            *)
              if [[ "$is_draft" == "false" ]]; then
                released=true
              fi
              ;;
          esac
          jq -n --argjson released "$released" --arg version "$VERSION" \
            '{schemaVersion:1,released:$released,recorded:false,version:$version}' > release-run/transaction-state.json
      - name: Retain the transaction state for triage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-transaction-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-run/transaction-state.json
          if-no-files-found: error
          retention-days: 90
          overwrite: true
      - name: Record the handed-over digests
        id: handoff_digests
        run: |
          mkdir -p release-published
          cp release-run/transaction.json release-run/event.json release-published/
          {
            echo "transaction_digest=sha256:$(shasum -a 256 release-published/transaction.json | awk '{print $1}')"
            echo "event_digest=sha256:$(shasum -a 256 release-published/event.json | awk '{print $1}')"
          } >> "$GITHUB_OUTPUT"
      - name: Hand the published transaction to the next jobs
        id: handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-published-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-published/
          if-no-files-found: error
          retention-days: 90
      - name: Retain the publication record
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-publication-${{ needs.preflight.outputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-run/
          if-no-files-found: error
          retention-days: 90

  verify-public:
    name: Verify fresh public installs
    needs: [preflight, release, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: bigpixelrocket/mise-php
          ref: ${{ needs.release.outputs.mise_commit }}
          path: mise-php
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          github_token: ${{ github.token }}
          cache: false
      - name: Verify fresh public exact-version and branch-shorthand installs
        run: |
          unset MISE_PHP_API_BASE_URL
          temporary="$(mktemp -d)"
          export MISE_DATA_DIR="$temporary/data"
          export MISE_CACHE_DIR="$temporary/cache"
          export MISE_CONFIG_DIR="$temporary/config"
          export MISE_STATE_DIR="$temporary/state"
          branch="$VERSION"
          branch="${branch%%-*}"
          branch="${branch%.*}"
          mise plugin link php "$GITHUB_WORKSPACE/mise-php"
          mise install "php@$VERSION"
          mise install "php@$branch"
          mise exec "php@$VERSION" -- php -v
          mise exec "php@$branch" -- php -v

  finalize:
    name: Record the verified release
    needs: [preflight, publish, verify-public]
    if: ${{ !cancelled() && needs.publish.result == 'success' && needs['verify-public'].result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: php-autorelease-publish
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      EXACT_COMMIT: ${{ needs.preflight.outputs.exact_commit }}
      ACTION_KEY: ${{ needs.preflight.outputs.action_key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.preflight.outputs.exact_commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Download the published transaction
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.publish.outputs.handoff_artifact_id }}
          path: release-published
          digest-mismatch: error
      - name: Verify the handed-over transaction
        env:
          TRANSACTION_DIGEST: ${{ needs.publish.outputs.transaction_digest }}
          EVENT_DIGEST: ${{ needs.publish.outputs.event_digest }}
        run: |
          test "$(find release-published -type f -print | LC_ALL=C sort | paste -sd ' ' -)" \
            = "release-published/event.json release-published/transaction.json"
          test "sha256:$(shasum -a 256 release-published/transaction.json | awk '{print $1}')" = "$TRANSACTION_DIGEST"
          test "sha256:$(shasum -a 256 release-published/event.json | awk '{print $1}')" = "$EVENT_DIGEST"
          test "$(jq -r .state release-published/transaction.json)" = "complete"
          test "$(jq -r .version release-published/transaction.json)" = "$VERSION"
          test "$(jq -r .actionKey release-published/event.json)" = "$ACTION_KEY"
          mkdir -p release-run
          cp release-published/transaction.json release-published/event.json release-run/
      - name: Complete durable event
        run: |
          jq -n --arg version "$VERSION" --argjson assets "$(jq .assetDigests release-run/transaction.json)" \
            '[{kind:"published_release",version:$version,assetDigests:$assets}]' > release-run/evidence.json
          ./scripts/autorelease-event --event release-run/event.json --target released \
            --evidence release-run/evidence.json --output release-run/next-event.json
          mv release-run/next-event.json release-run/event.json
          jq -n --arg version "$VERSION" \
            '[{kind:"fresh_public_mise_installs",version:$version,modes:["exact","branch_shorthand"]}]' > release-run/evidence.json
          ./scripts/autorelease-event --event release-run/event.json --target public_install_verified \
            --evidence release-run/evidence.json --output release-run/next-event.json
          mv release-run/next-event.json release-run/event.json
          jq -n '[{kind:"transaction_complete"}]' > release-run/evidence.json
          ./scripts/autorelease-event --event release-run/event.json --target complete \
            --evidence release-run/evidence.json --output release-run/next-event.json
          mv release-run/next-event.json release-run/event.json
          jq --arg version "$VERSION" \
            '.severity="info" | .summary="PHP \($version) was published and verified through fresh exact and branch-shorthand mise installs." | .finalResult="passed"' \
            release-run/event.json > release-run/notification-event.json
      - name: Commit final event record through a checked PR
        id: event_pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main
          git checkout -B "autorelease/event-${{ github.run_id }}" origin/main
          base="$(git rev-parse HEAD)"
          filename="$(./autorelease/control.py action-filename "$ACTION_KEY")"
          cp release-run/event.json "autorelease-events/$filename"
          git add "autorelease-events/$filename"
          git -c user.name=autorelease -c user.email=autorelease@invalid \
            commit -m "chore: complete $ACTION_KEY"
          head="$(git rev-parse HEAD)"
          record="autorelease-events/$filename"
          digest="sha256:$(shasum -a 256 "$record" | awk '{print $1}')"
          gh auth setup-git
          git push origin HEAD
          url="$(gh pr create --base main --head "autorelease/event-${{ github.run_id }}" \
            --title "chore: complete $ACTION_KEY" \
            --body "Durable event record for the immutable verified release transaction.")"
          {
            echo "number=${url##*/}"
            echo "base_sha=$base"
            echo "head_sha=$head"
            echo "record=$record"
            echo "digest=$digest"
          } >> "$GITHUB_OUTPUT"
      - name: Validate and merge final event record
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/merge-record-pr \
            --pr "${{ steps.event_pr.outputs.number }}" \
            --base "${{ steps.event_pr.outputs.base_sha }}" \
            --head "${{ steps.event_pr.outputs.head_sha }}" \
            --record "${{ steps.event_pr.outputs.record }}" \
            --digest "${{ steps.event_pr.outputs.digest }}" \
            --checks-output release-run/event-checks.json
      - name: Notify owner of completed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/notify-autorelease \
            --event release-run/notification-event.json \
            --state release-run/notification-state.json \
            --output release-run/notification-next.json \
            --backend github \
            --repo "${{ github.repository }}" \
            --owner "${{ vars.AUTORELEASE_OWNER }}"
      # This job only runs after publication, so the release is live either way; the
      # state now also says whether its event record reached main.
      - name: Record whether the event record merged
        if: always()
        env:
          MERGE_OUTCOME: ${{ steps.merge.outcome }}
        run: |
          mkdir -p release-run
          recorded=false
          if [[ "$MERGE_OUTCOME" == "success" ]]; then
            recorded=true
          fi
          jq -n --argjson recorded "$recorded" --arg version "$VERSION" \
            '{schemaVersion:1,released:true,recorded:$recorded,version:$version}' > release-run/transaction-state.json
      - name: Retain the transaction state for triage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-transaction-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-run/transaction-state.json
          if-no-files-found: error
          retention-days: 90
          overwrite: true
      - name: Retain the event record
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-record-${{ needs.preflight.outputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-run/
          if-no-files-found: error
          retention-days: 90

  notify-failure:
    name: Notify actionable release failure
    needs: [preflight, release, verify-draft, publish, verify-public, finalize]
    # A skipped release already keeps this job quiet when preflight rejects the
    # dispatch, but the preflight result is asserted anyway so the gate survives a
    # later change to the release job's own condition. A failed build reaches this
    # job through the release job, which fails before any effect unless it completes
    # an existing release.
    if: >-
      always() && needs.preflight.result == 'success' && (
      needs.release.result == 'failure' || needs['verify-draft'].result == 'failure' ||
      needs.publish.result == 'failure' || needs['verify-public'].result == 'failure' ||
      needs.finalize.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # A rerun of the failed jobs keeps the state an earlier attempt retained, so the
      # newest attempt that retained one is read. A run that failed before any attempt
      # retained state keeps the critical default below.
      - name: Download the retained transaction state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          attempt="${{ github.run_attempt }}"
          while (( attempt > 0 )); do
            if gh run download "${{ github.run_id }}" --repo "${{ github.repository }}" \
              --name "release-transaction-state-${{ github.run_id }}-$attempt" --dir release-state; then
              break
            fi
            attempt=$((attempt - 1))
          done
      - name: Create a structured event keyed on the transaction state
        env:
          ACTION_KEY: ${{ needs.preflight.outputs.action_key }}
          VERSION: ${{ needs.preflight.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # A live release is not a critical failure: the watcher files the missing
          # event record on its own. Only an unpublished release stops the pipeline.
          released=false
          recorded=false
          if [[ -f release-state/transaction-state.json ]]; then
            released="$(jq -r .released release-state/transaction-state.json)"
            recorded="$(jq -r '.recorded // false' release-state/transaction-state.json)"
          fi
          if [[ "$released" == "true" && "$recorded" == "true" ]]; then
            state=released
            severity=warning
            summary="PHP $VERSION was published and its event record is complete, but a job of the publish run failed: $RUN_URL"
            fingerprint="release-run-failed-after-record:$ACTION_KEY"
          elif [[ "$released" == "true" ]]; then
            state=released
            severity=warning
            summary="PHP $VERSION was published; its event record is pending and the watcher will recover it: $RUN_URL"
            fingerprint="release-record-pending:$ACTION_KEY"
          else
            state=blocked
            severity=critical
            summary="Autorelease failed for PHP $VERSION: $RUN_URL"
            fingerprint="release-failure:$ACTION_KEY"
          fi
          jq -n \
            --arg actionKey "$ACTION_KEY" \
            --arg state "$state" \
            --arg severity "$severity" \
            --arg summary "$summary" \
            --arg failureFingerprint "$fingerprint" \
            '{actionKey:$actionKey,state:$state,severity:$severity,humanActionRequired:false,summary:$summary,failureFingerprint:$failureFingerprint}' \
            > event.json
      - name: Notify owner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/notify-autorelease \
            --event event.json \
            --state notification-state.json \
            --output notification.json \
            --backend github \
            --repo "${{ github.repository }}" \
            --owner "${{ vars.AUTORELEASE_OWNER }}"
