name: PHP autorelease watcher

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: php-autorelease-watcher
  cancel-in-progress: false

jobs:
  investigate:
    name: Capture and investigate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      trigger: ${{ steps.decision.outputs.trigger }}
      action_key: ${{ steps.plan.outputs.action_key }}
      edits_required: ${{ steps.plan.outputs.edits_required }}
      base_sha: ${{ steps.plan.outputs.base_sha }}
      action: ${{ steps.plan.outputs.action }}
      # Recovery is decided deterministically and runs beside the admitted plan, so it
      # carries its own key rather than competing for the plan's.
      record_action_key: ${{ steps.decision.outputs.action_key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Capture fixed raw evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          ./autorelease/control.py validate-policy
          ./scripts/capture-autorelease-evidence --output autorelease-run/evidence
      - name: Decide whether an agent call is required
        id: decision
        run: |
          self_update=()
          if [[ "$(git diff-tree --no-commit-id --name-only -r HEAD)" == "autorelease-state/last-evidence.json" ]]; then
            self_update=(--self-evidence-update)
          fi
          ./scripts/watch-autorelease-evidence \
            --manifest autorelease-run/evidence/evidence-manifest.json \
            --previous autorelease-state/last-evidence.json \
            --events autorelease-events \
            "${self_update[@]}" \
            --output autorelease-run/watch-decision.json
          {
            echo "trigger=$(jq -r .trigger autorelease-run/watch-decision.json)"
            echo "model_call=$(jq -r .modelCall autorelease-run/watch-decision.json)"
            echo "action_key=$(jq -r .actionKey autorelease-run/watch-decision.json)"
          } >> "$GITHUB_OUTPUT"
      - name: Record exact preconditions
        if: steps.decision.outputs.model_call == 'true'
        run: |
          jq -n \
            --arg phpBinHead "$(git rev-parse HEAD)" \
            --arg misePhpHead "$(jq -r .sha autorelease-run/evidence/raw/mise_php_state.body)" \
            --arg supportPolicyDigest "$(./autorelease/control.py digest support-policy.json)" \
            '{phpBinHead:$phpBinHead,misePhpHead:$misePhpHead,supportPolicyDigest:$supportPolicyDigest}' \
            > autorelease-run/preconditions.json
          [[ "$(jq -r .misePhpHead autorelease-run/preconditions.json)" =~ ^[0-9a-f]{40}$ ]]
          shopt -s nullglob
          event_files=(autorelease-events/*.json)
          if (( ${#event_files[@]} )); then
            jq -s '[.[] | select(.state=="complete") | .actionKey] | sort | unique' \
              "${event_files[@]}" > autorelease-run/completed-actions.json
          else
            printf '[]\n' > autorelease-run/completed-actions.json
          fi
      - name: Prepare investigation contract
        if: steps.decision.outputs.model_call == 'true'
        run: |
          ./scripts/prepare-agent-task \
            --phase investigation \
            --action-key "investigate:${{ steps.decision.outputs.trigger }}:${{ github.run_id }}" \
            --goal "Classify the captured autorelease trigger and emit one evidence-bound plan." \
            --preconditions autorelease-run/preconditions.json \
            --allowed-authority read_repository \
            --allowed-authority read_captured_evidence \
            --allowed-authority allowlisted_web_search \
            --non-goal repository_mutation \
            --non-goal required_check_execution \
            --non-goal irreversible_github_effect \
            --stop-condition missing_or_contradictory_required_evidence \
            --stop-condition changed_precondition \
            --stop-condition required_protected_change \
            --shared .github/codex/autorelease/shared.md \
            --phase-template .github/codex/autorelease/investigation.md \
            --contract-output autorelease-run/event-contract.json \
          --prompt-output autorelease-run/investigation-prompt.md
          mkdir -p "$RUNNER_TEMP/codex-home"
          cp .codex/investigation.config.toml "$RUNNER_TEMP/codex-home/config.toml"
      - name: Run read-only Codex investigation
        if: steps.decision.outputs.model_call == 'true'
        uses: openai/codex-action@52fe01ec70a42f454c9d2ebd47598f9fd6893d56 # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          codex-version: 0.145.0
          prompt-file: autorelease-run/investigation-prompt.md
          output-file: autorelease-run/autorelease-plan.json
          codex-home: ${{ runner.temp }}/codex-home
          sandbox: read-only
          safety-strategy: drop-sudo
          allow-users: loadinglucian
          allow-bots: false
          allow-bot-users: github-actions[bot]
          codex-args: '["--strict-config","--ephemeral","--output-schema","schemas/autorelease-plan.schema.json"]'
      - name: Admit plan against exact evidence
        if: steps.decision.outputs.model_call == 'true'
        run: |
          ./scripts/admit-autorelease-plan \
            --plan autorelease-run/autorelease-plan.json \
            --manifest autorelease-run/evidence/evidence-manifest.json \
            --contract autorelease-run/event-contract.json \
            --shared .github/codex/autorelease/shared.md \
            --phase .github/codex/autorelease/investigation.md \
            --event-contract autorelease-run/event-contract.json \
            --php-bin-head "$(git rev-parse HEAD)" \
            --mise-php-head "$(jq -r .misePhpHead autorelease-run/preconditions.json)" \
            --policy-digest "$(./autorelease/control.py digest support-policy.json)" \
            --completed-actions autorelease-run/completed-actions.json \
            --output autorelease-run/admission.json
      - name: Expose admitted plan
        id: plan
        if: steps.decision.outputs.model_call == 'true'
        run: |
          echo "action_key=$(jq -r .actionKey autorelease-run/autorelease-plan.json)" >> "$GITHUB_OUTPUT"
          echo "edits_required=$(jq -r .editsRequired autorelease-run/autorelease-plan.json)" >> "$GITHUB_OUTPUT"
          echo "base_sha=$(jq -r .preconditions.phpBinHead autorelease-run/autorelease-plan.json)" >> "$GITHUB_OUTPUT"
          echo "action=$(jq -r .action autorelease-run/autorelease-plan.json)" >> "$GITHUB_OUTPUT"
      - name: Retain evidence and admitted plan
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: autorelease-investigation-${{ github.run_id }}
          path: autorelease-run/
          if-no-files-found: error
          retention-days: 90
          include-hidden-files: true

  coordinate:
    name: Dispatch admitted next phase
    needs: investigate
    if: needs.investigate.outputs.action_key != '' || needs.investigate.outputs.record_action_key != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      artifact-metadata: write
      attestations: write
      checks: write
      contents: write
      id-token: write
      pull-requests: write
      statuses: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Download admitted investigation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${{ github.run_id }}" \
            --repo "${{ github.repository }}" \
            --name "autorelease-investigation-${{ github.run_id }}" \
            --dir autorelease-plan-download
      - name: Read unattended mutation state
        id: operator
        run: |
          test "$(jq -r .unattendedMutation .github/autorelease-operator.json)" = "enabled" \
            && echo "enabled=true" >> "$GITHUB_OUTPUT" \
            || echo "enabled=false" >> "$GITHUB_OUTPUT"
      - name: Recover the event record of a published release
        id: recover
        if: needs.investigate.outputs.record_action_key != ''
        # A blocked or failing repair must never suppress the other watcher paths, so
        # the step is allowed to fail here and is re-raised as a job failure after them.
        continue-on-error: true
        env:
          ACTION_KEY: ${{ needs.investigate.outputs.record_action_key }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$(jq -r .unattendedMutation .github/autorelease-operator.json)" != "enabled" ]]; then
            echo "Unattended mutation is paused; the missing event record is left for an operator."
            exit 0
          fi
          # new_patch:8.5.9 is tag 8.5.9 and recipe_rebuild:8.5.9:2 is tag 8.5.9-2.
          version="${ACTION_KEY#*:}"
          version="${version/:/-}"
          classification="${ACTION_KEY%%:*}"
          filename="$(printf '%s' "$ACTION_KEY" | tr ':/' '--').json"
          event="autorelease-events/$filename"
          if [[ -f "$event" ]]; then
            echo "The event record for $ACTION_KEY reached main after the decision was taken."
            exit 0
          fi
          test "$(gh release view "$version" --repo "${{ github.repository }}" --json isDraft --jq .isDraft)" = "false"
          test "$(gh release view "$version" --repo "${{ github.repository }}" --json isImmutable --jq .isImmutable)" = "true"
          release_commit="$(gh api "repos/${{ github.repository }}/commits/$version" --jq .sha)"
          [[ "$release_commit" =~ ^[0-9a-f]{40}$ ]]
          # A hand-made release supplies both its assets and its own checksums, so the
          # bytes are only trusted once an attestation ties them to a build of this
          # repository, and the tag is only trusted once it is reachable from main.
          gh release verify "$version" --repo "${{ github.repository }}" --format json \
            > autorelease-plan-download/recovered-attestation.json
          git merge-base --is-ancestor "$release_commit" origin/main
          assets=autorelease-plan-download/recovered-release
          mkdir -p "$assets"
          gh release download "$version" --repo "${{ github.repository }}" --dir "$assets" --clobber
          ./scripts/validate-autorelease-archive \
            --archive "$assets/php-$version-cli-macos-aarch64.tar.gz" \
            --version "$version"
          archive_digest="$(shasum -a 256 "$assets/php-$version-cli-macos-aarch64.tar.gz" | awk '{print $1}')"
          grep -Fx "$archive_digest  php-$version-cli-macos-aarch64.tar.gz" "$assets/SHA256SUMS"
          checksums_digest="$(shasum -a 256 "$assets/SHA256SUMS" | awk '{print $1}')"
          # The record states exactly what this run verified: the public release bytes.
          # A fresh install is not reverifiable here, so it is never claimed as evidence.
          jq -n \
            --arg actionKey "$ACTION_KEY" \
            --arg classification "$classification" \
            --arg commit "$release_commit" \
            --arg runId "${{ github.run_id }}" \
            --arg evidenceManifestDigest "$(jq -r .manifestDigest autorelease-plan-download/evidence/evidence-manifest.json)" \
            '{schemaVersion:1,actionKey:$actionKey,classification:$classification,state:"release_requested",history:[],phpBinCommit:$commit,evidenceManifestDigest:$evidenceManifestDigest,recoveredByRunId:$runId}' \
            > autorelease-plan-download/recovered-event.json
          jq -n \
            --arg version "$version" \
            --arg commit "$release_commit" \
            --arg archive "sha256:$archive_digest" \
            --arg checksums "sha256:$checksums_digest" \
            --arg attestation "sha256:$(shasum -a 256 autorelease-plan-download/recovered-attestation.json | awk '{print $1}')" \
            '[{kind:"published_immutable_release",version:$version,phpBinCommit:$commit,attestationDigest:$attestation,assetDigests:{("php-"+$version+"-cli-macos-aarch64.tar.gz"):$archive,"SHA256SUMS":$checksums}}]' \
            > autorelease-plan-download/recovery-evidence.json
          ./scripts/autorelease-event --event autorelease-plan-download/recovered-event.json --target released \
            --evidence autorelease-plan-download/recovery-evidence.json \
            --output autorelease-plan-download/recovered-event.next
          mv autorelease-plan-download/recovered-event.next autorelease-plan-download/recovered-event.json
          jq -n --arg version "$version" \
            '[{kind:"public_release_bytes_reverified",version:$version,modes:["public_download"]}]' \
            > autorelease-plan-download/recovery-evidence.json
          ./scripts/autorelease-event --event autorelease-plan-download/recovered-event.json \
            --target public_install_verified \
            --evidence autorelease-plan-download/recovery-evidence.json \
            --output autorelease-plan-download/recovered-event.next
          mv autorelease-plan-download/recovered-event.next autorelease-plan-download/recovered-event.json
          jq -n --arg runId "${{ github.run_id }}" '[{kind:"record_recovered_by_watcher",runId:$runId}]' \
            > autorelease-plan-download/recovery-evidence.json
          ./scripts/autorelease-event --event autorelease-plan-download/recovered-event.json --target complete \
            --evidence autorelease-plan-download/recovery-evidence.json \
            --output autorelease-plan-download/recovered-event.next
          mv autorelease-plan-download/recovered-event.next autorelease-plan-download/recovered-event.json
          base="$(git rev-parse HEAD)"
          # The protected-controls exemption trusts this branch prefix from this
          # workflow; a recovered record is filed exactly like an EOL completion.
          branch="autorelease/eol-complete-${{ github.run_id }}"
          git checkout -B "$branch"
          cp autorelease-plan-download/recovered-event.json "$event"
          git add "$event"
          git -c user.name=autorelease-watcher -c user.email=autorelease@invalid \
            commit -m "chore: complete $ACTION_KEY"
          head="$(git rev-parse HEAD)"
          digest="sha256:$(shasum -a 256 "$event" | awk '{print $1}')"
          gh auth setup-git
          git push origin HEAD
          url="$(gh pr create --base main --head "$branch" --title "chore: complete $ACTION_KEY" \
            --body "Recovered durable event record for an immutable published release.")"
          number="${url##*/}"
          ./scripts/dispatch-pr-checks \
            --pr "$number" \
            --check "Script checks" \
            --output autorelease-plan-download/recovery-checks.json
          ./scripts/assert-admission-checks --require-protected-controls --checks autorelease-plan-download/recovery-checks.json
          test "$(gh pr view "$number" --json headRefOid --jq .headRefOid)" = "$head"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$base"
          test "$(git rev-list --parents -n 1 "$head")" = "$head $base"
          test "$(git diff --name-only "$base" "$head")" = "$event"
          test "sha256:$(git show "$head:$event" | shasum -a 256 | awk '{print $1}')" = "$digest"
          gh pr merge "$number" --squash --delete-branch
          echo "merged=true" >> "$GITHUB_OUTPUT"
          jq --arg version "$version" \
            '.severity="info" | .summary="The event record for the published PHP \($version) release was recovered by the watcher." | .finalResult="passed"' \
            "$event" > autorelease-plan-download/recovery-notification.json
          ./scripts/notify-autorelease \
            --event autorelease-plan-download/recovery-notification.json \
            --state autorelease-plan-download/recovery-notification-state.json \
            --output autorelease-plan-download/recovery-notification-next.json \
            --backend github --repo "${{ github.repository }}" --owner "${{ vars.AUTORELEASE_OWNER }}"
      - name: Prepare deterministic no-change evidence
        id: evidence
        if: needs.investigate.outputs.action == 'no_change' && steps.operator.outputs.enabled == 'true' && steps.recover.outputs.merged != 'true'
        run: |
          git checkout -B "autorelease/evidence-${{ github.run_id }}" origin/main
          mkdir -p autorelease-state
          jq -n \
            --arg manifestDigest "$(jq -r .manifestDigest autorelease-plan-download/evidence/evidence-manifest.json)" \
            --arg planDigest "$(jq -r .planDigest autorelease-plan-download/admission.json)" \
            --argjson captureDigests "$(jq '[.captures[] | {captureId,digest,status}]' autorelease-plan-download/evidence/evidence-manifest.json)" \
            '{schemaVersion:1,manifestDigest:$manifestDigest,planDigest:$planDigest,captures:$captureDigests}' \
            > autorelease-state/last-evidence.json
          if [[ -z "$(git status --porcelain -- autorelease-state/last-evidence.json)" ]]; then
            echo "already_recorded=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "already_recorded=false" >> "$GITHUB_OUTPUT"
          jq -n \
            --arg runId "${{ github.run_id }}" \
            --arg sourceSha "${{ needs.investigate.outputs.base_sha }}" \
            --arg actionKey "${{ needs.investigate.outputs.action_key }}" \
            --arg manifestDigest "$(jq -r .manifestDigest autorelease-plan-download/evidence/evidence-manifest.json)" \
            '{schemaVersion:1,runId:$runId,sourceSha:$sourceSha,actionKey:$actionKey,manifestDigest:$manifestDigest}' \
            > autorelease-plan-download/evidence-attestation-predicate.json
      - name: Attest deterministic no-change evidence
        if: needs.investigate.outputs.action == 'no_change' && steps.operator.outputs.enabled == 'true' && steps.evidence.outputs.already_recorded == 'false'
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: autorelease-state/last-evidence.json
          predicate-type: https://bigpixelrocket.dev/autorelease/evidence-state/v1
          predicate-path: autorelease-plan-download/evidence-attestation-predicate.json
      - name: Dispatch implementation or no-edit release
        env:
          EVIDENCE_ALREADY_RECORDED: ${{ steps.evidence.outputs.already_recorded }}
          RECORD_ACTION_KEY: ${{ needs.investigate.outputs.record_action_key }}
          RECOVERY_MERGED: ${{ steps.recover.outputs.merged }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$(jq -r .unattendedMutation .github/autorelease-operator.json)" != "enabled" ]]; then
            echo "Unattended mutation is paused; retained investigation remains read-only."
            exit 0
          fi
          if [[ -n "$RECORD_ACTION_KEY" ]]; then
            # A recovery attempt can leave the checkout on its own branch, and every
            # path below measures its write against main.
            git checkout -f main
          fi
          action="${{ needs.investigate.outputs.action }}"
          if [[ -z "$action" || "$action" == "none" ]]; then
            echo "The run carries no admitted plan to dispatch."
            exit 0
          fi
          if [[ "$RECOVERY_MERGED" == "true" && ( "$action" == "no_change" || "$action" == "branch_eol" ) ]]; then
            # Both writes assert an untouched base, and the recovered record has just
            # moved it; the next run replays this one against the new main.
            echo "A recovered event record landed on main this run, so the $action write waits for the next run."
            exit 0
          fi
          if [[ "$action" == "no_change" && "$EVIDENCE_ALREADY_RECORDED" == "true" ]]; then
            echo "The exact deterministic evidence state is already recorded."
            exit 0
          fi
          if [[ "$action" == "blocked" || "$action" == "needs_human" ]]; then
            jq -n \
              --arg actionKey "${{ needs.investigate.outputs.action_key }}" \
              --arg state "$action" \
              --arg summary "$(jq -r .summary autorelease-plan-download/autorelease-plan.json)" \
              --arg evidenceDigest "$(jq -r .manifestDigest autorelease-plan-download/evidence/evidence-manifest.json)" \
              '{actionKey:$actionKey,state:$state,severity:"warning",humanActionRequired:($state=="needs_human"),summary:$summary,evidenceDigest:$evidenceDigest}' \
              > autorelease-plan-download/notification-event.json
            ./scripts/notify-autorelease \
              --event autorelease-plan-download/notification-event.json \
              --state autorelease-plan-download/notification-state.json \
              --output autorelease-plan-download/notification-next.json \
              --backend github \
              --repo "${{ github.repository }}" \
              --owner "${{ vars.AUTORELEASE_OWNER }}"
            exit 0
          elif [[ "$action" == "new_branch" || "$action" == "branch_eol" ]]; then
            jq -n \
              --arg actionKey "${{ needs.investigate.outputs.action_key }}" \
              --arg summary "$(jq -r .notification.summary autorelease-plan-download/autorelease-plan.json)" \
              --arg evidenceDigest "$(jq -r .manifestDigest autorelease-plan-download/evidence/evidence-manifest.json)" \
              '{actionKey:$actionKey,state:"detected",severity:"info",humanActionRequired:false,summary:$summary,evidenceDigest:$evidenceDigest}' \
              > autorelease-plan-download/lifecycle-notification.json
            ./scripts/notify-autorelease \
              --event autorelease-plan-download/lifecycle-notification.json \
              --state autorelease-plan-download/lifecycle-notification-state.json \
              --output autorelease-plan-download/lifecycle-notification-next.json \
              --backend github \
              --repo "${{ github.repository }}" \
              --owner "${{ vars.AUTORELEASE_OWNER }}"
          fi

          if [[ "$action" == "no_change" ]]; then
            branch="autorelease/evidence-${{ github.run_id }}"
            base="$(git rev-parse HEAD)"
            git add autorelease-state/last-evidence.json
            git -c user.name=autorelease-watcher -c user.email=autorelease@invalid \
              commit -m "chore: record reviewed autorelease evidence"
            head="$(git rev-parse HEAD)"
            record_digest="sha256:$(shasum -a 256 autorelease-state/last-evidence.json | awk '{print $1}')"
            gh auth setup-git
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
              git fetch origin "$branch:refs/remotes/origin/$branch"
            fi
            git push --force-with-lease origin "HEAD:refs/heads/$branch"
            number="$(gh pr list --state open --head "$branch" --json number --jq '.[0].number // empty')"
            if [[ -z "$number" ]]; then
              url="$(gh pr create --base main --head "$branch" \
                --title "chore: record reviewed autorelease evidence" \
                --body "Opaque evidence state for a reviewed no-change result.")"
              number="${url##*/}"
            fi
            ./scripts/dispatch-pr-checks \
              --pr "$number" \
              --check "Script checks" \
              --output autorelease-plan-download/no-change-checks.json
            ./scripts/assert-admission-checks --require-protected-controls --checks autorelease-plan-download/no-change-checks.json
            test "$(gh pr view "$number" --json headRefOid --jq .headRefOid)" = "$head"
            git fetch origin main
            test "$(git rev-parse origin/main)" = "$base"
            test "$(git rev-list --parents -n 1 "$head")" = "$head $base"
            test "$(git diff --name-only "$base" "$head")" = "autorelease-state/last-evidence.json"
            test "sha256:$(git show "$head:autorelease-state/last-evidence.json" | shasum -a 256 | awk '{print $1}')" = "$record_digest"
            gh pr merge "$number" --squash --delete-branch
            exit 0
          elif [[ "${{ needs.investigate.outputs.edits_required }}" == "true" ]]; then
            gh workflow run autorelease-implement.yml \
              --repo "${{ github.repository }}" \
              --ref main \
              -f investigation_run_id="${{ github.run_id }}" \
              -f exact_base_sha="${{ needs.investigate.outputs.base_sha }}" \
              -f phase=implementation
          elif [[ "$action" == "new_patch" || "$action" == "new_branch" || "$action" == "reconcile_partial" ]]; then
            if [[ "${{ needs.investigate.outputs.action_key }}" == "$RECORD_ACTION_KEY" ]]; then
              # The completed-action ledger the plan was admitted against is exactly the
              # one missing this record, so the release it selects is already public.
              echo "The selected action is already published and its record is being recovered."
              exit 0
            fi
            if [[ "$action" == "new_branch" ]]; then
              filename="$(printf '%s' "${{ needs.investigate.outputs.action_key }}" | tr ':/' '--').json"
              if ! gh api "repos/bigpixelrocket/mise-php/contents/readiness/$filename?ref=main" >/dev/null 2>&1; then
                echo "Waiting for exact mise-php readiness for $filename."
                exit 0
              fi
            fi
            version="$(jq -r .releaseIntent.version autorelease-plan-download/autorelease-plan.json)"
            gh workflow run autorelease-publish.yml \
              --repo "${{ github.repository }}" \
              --ref main \
              -f action_key="${{ needs.investigate.outputs.action_key }}" \
              -f investigation_run_id="${{ github.run_id }}" \
              -f version="$version" \
              -f exact_commit="${{ needs.investigate.outputs.base_sha }}"
          elif [[ "$action" == "branch_eol" ]]; then
            action_key="${{ needs.investigate.outputs.action_key }}"
            filename="$(printf '%s' "$action_key" | tr ':/' '--').json"
            if ! gh api "repos/bigpixelrocket/mise-php/contents/readiness/$filename?ref=main" \
              --jq .content > autorelease-plan-download/mise-readiness.b64; then
              echo "Waiting for exact mise-php EOL readiness for $filename."
              exit 0
            fi
            base64 --decode < autorelease-plan-download/mise-readiness.b64 \
              > autorelease-plan-download/mise-readiness.json
            event="autorelease-events/$filename"
            test -f "$event"
            test "$(jq -r .actionKey autorelease-plan-download/mise-readiness.json)" = "$action_key"
            test "$(jq -r .ready autorelease-plan-download/mise-readiness.json)" = "true"
            test "$(jq -r .supportPolicyDigest "$event")" = "$(jq -r .policyDigest autorelease-plan-download/mise-readiness.json)"
            test "$(jq -r .policyInvariantsDigest "$event")" = "$(jq -r .policyInvariantsDigest autorelease-plan-download/mise-readiness.json)"
            policy_commit="$(jq -r .phpBinPolicyCommit autorelease-plan-download/mise-readiness.json)"
            gh api "repos/${{ github.repository }}/contents/support-policy.json?ref=$policy_commit" \
              --jq .content | base64 --decode > autorelease-plan-download/readiness-policy.json
            test "sha256:$(shasum -a 256 autorelease-plan-download/readiness-policy.json | awk '{print $1}')" = "$(jq -r .policyDigest autorelease-plan-download/mise-readiness.json)"
            jq -n --slurpfile ready autorelease-plan-download/mise-readiness.json \
              '[{kind:"mise_eol_readiness",record:$ready[0]}]' > autorelease-plan-download/transition-evidence.json
            if [[ "$(jq -r .state "$event")" == "php_bin_ready" ]]; then
              ./scripts/autorelease-event --event "$event" --target mise_ready \
                --evidence autorelease-plan-download/transition-evidence.json --output "$event.next"
              mv "$event.next" "$event"
            fi
            test "$(jq -r .state "$event")" = "mise_ready"
            jq -n '[{kind:"eol_support_and_publication_cleanup_verified"}]' \
              > autorelease-plan-download/transition-evidence.json
            ./scripts/autorelease-event --event "$event" --target complete \
              --evidence autorelease-plan-download/transition-evidence.json --output "$event.next"
            mv "$event.next" "$event"
            base="$(git rev-parse HEAD)"
            branch="autorelease/eol-complete-${{ github.run_id }}"
            git checkout -B "$branch"
            git add "$event"
            git -c user.name=autorelease-lifecycle -c user.email=autorelease@invalid \
              commit -m "chore: complete $action_key"
            head="$(git rev-parse HEAD)"
            digest="sha256:$(shasum -a 256 "$event" | awk '{print $1}')"
            gh auth setup-git
            git push origin HEAD
            url="$(gh pr create --base main --head "$branch" --title "chore: complete $action_key" \
              --body "Deterministic EOL completion bound to exact cross-repository readiness.")"
            number="${url##*/}"
            ./scripts/dispatch-pr-checks \
              --pr "$number" \
              --check "Script checks" \
              --output autorelease-plan-download/eol-checks.json
            ./scripts/assert-admission-checks --require-protected-controls --checks autorelease-plan-download/eol-checks.json
            test "$(gh pr view "$number" --json headRefOid --jq .headRefOid)" = "$head"
            git fetch origin main
            test "$(git rev-parse origin/main)" = "$base"
            test "$(git rev-list --parents -n 1 "$head")" = "$head $base"
            test "$(git diff --name-only "$base" "$head")" = "$event"
            test "sha256:$(git show "$head:$event" | shasum -a 256 | awk '{print $1}')" = "$digest"
            gh pr merge "$number" --squash --delete-branch
            jq '.severity="info" | .summary="Branch EOL support cleanup completed at exact php-bin and mise-php commits." | .finalResult="passed"' \
              "$event" > autorelease-plan-download/eol-notification.json
            ./scripts/notify-autorelease \
              --event autorelease-plan-download/eol-notification.json \
              --state autorelease-plan-download/eol-notification-state.json \
              --output autorelease-plan-download/eol-notification-next.json \
              --backend github --repo "${{ github.repository }}" --owner "${{ vars.AUTORELEASE_OWNER }}"
          else
            echo "Action $action requires repository readiness before release." >&2
          fi
      - name: Report an unrecovered event record
        # Raised last so the failure reaches the owner without having blocked the
        # reconciliation, lifecycle, and selection paths of the same run.
        if: steps.recover.outcome == 'failure'
        run: |
          echo "Recovering the event record for ${{ needs.investigate.outputs.record_action_key }} failed." >&2
          exit 1

  notify-failure:
    name: Notify actionable watcher failure
    needs: [investigate, coordinate]
    if: always() && (needs.investigate.result == 'failure' || needs.coordinate.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Create structured critical event
        run: |
          jq -n \
            --arg actionKey "watcher-failure:${{ github.run_id }}" \
            --arg summary "Autorelease watcher failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{actionKey:$actionKey,state:"blocked",severity:"critical",humanActionRequired:true,summary:$summary,failureFingerprint:$actionKey}' \
            > event.json
      - name: Notify owner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/notify-autorelease \
            --event event.json \
            --state "autorelease-events/notification-watcher-failure-${{ github.run_id }}.json" \
            --output notification.json \
            --backend github \
            --repo "${{ github.repository }}" \
            --owner "${{ vars.AUTORELEASE_OWNER }}"
