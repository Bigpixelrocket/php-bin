name: CI

on:
  pull_request:
    paths-ignore:
      - autorelease-state/**
      - autorelease-events/**
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  scripts:
    name: Script checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install --yes shellcheck
      - name: Check shell scripts
        # The extensionless bash scripts are named one by one: every other
        # extensionless script under scripts/ is Python, which shellcheck cannot read.
        run: shellcheck scripts/*.sh scripts/assert-admission-checks scripts/dispatch-pr-checks
      - name: Run contract tests
        run: scripts/test.sh
