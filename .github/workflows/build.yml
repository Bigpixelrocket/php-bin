name: Build PHP spike

on:
  workflow_dispatch:
    inputs:
      php_version:
        description: PHP minor or patch version
        required: true
        default: "8.4"
        type: string
      stage:
        description: Spike stage
        required: true
        default: s4
        type: choice
        options:
          - s0
          - s1
          - s2
          - s3
          - s4
  pull_request:
    paths:
      - .spc-version
      - .spc-sha256
      - craft.yml
      - extensions.txt
      - expected-modules/**
      - stages/**
      - scripts/**
      - .github/workflows/build.yml

permissions:
  contents: read

concurrency:
  group: php-spike-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: PHP ${{ inputs.php_version || '8.4' }} ${{ inputs.stage || 's4' }}
    runs-on: macos-15
    timeout-minutes: 120
    env:
      GITHUB_TOKEN: ${{ github.token }}
      PHP_VERSION: ${{ inputs.php_version || '8.4' }}
      SPIKE_STAGE: ${{ inputs.stage || 's4' }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify runner architecture
        run: test "$(uname -s)" = Darwin && test "$(uname -m)" = arm64
      - name: Install build dependencies
        run: scripts/install-build-deps.sh
      - name: Install pinned StaticPHP
        run: scripts/install-spc.sh
      - name: Restore source cache
        uses: actions/cache@v4
        with:
          path: .build/${{ env.PHP_VERSION }}/${{ env.SPIKE_STAGE }}/downloads
          key: spc-${{ runner.os }}-${{ runner.arch }}-${{ env.PHP_VERSION }}-${{ env.SPIKE_STAGE }}-${{ hashFiles('.spc-version', 'stages/*.txt') }}
      - name: Build and verify
        run: scripts/build.sh "$PHP_VERSION" "$SPIKE_STAGE"
      - name: Package exact build
        if: env.SPIKE_STAGE == 's4'
        run: |
          php_bin=".build/$PHP_VERSION/$SPIKE_STAGE/buildroot/bin/php"
          actual_version="$($php_bin -r 'echo PHP_VERSION;')"
          scripts/package.sh "$php_bin" "$actual_version"
      - name: Upload build result
        if: env.SPIKE_STAGE == 's4'
        uses: actions/upload-artifact@v4
        with:
          name: php-${{ env.PHP_VERSION }}-cli-macos-aarch64
          path: .artifacts/
          if-no-files-found: error
