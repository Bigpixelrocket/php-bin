name: Autorelease email digest

# One deterministic TL;DR email per completed pipeline run attempt. The digest is
# rendered by `./autorelease/control.py email-digest` from retained run state
# only, so a template is selected — never written — at runtime, and no
# model-authored prose can reach the outbound channel.
#
# Both pipeline workflows call this one from their own last job, with the
# conclusion their other jobs reached, and nothing else starts it. GitHub starts no
# `workflow_run` for a run GITHUB_TOKEN started: the watcher dispatches every
# publish run that way, and each successful publish run dispatches the next watcher
# run that way. A `workflow_run` route would therefore leave those runs silent while
# emailing the others through a second route, so it is not used at all.
on:
  workflow_call:
    inputs:
      run_id:
        description: Run whose retained state the digest describes
        required: true
        type: string
      run_attempt:
        description: Attempt of that run
        required: true
        type: string
      workflow:
        description: Calling pipeline workflow, watcher or publish
        required: true
        type: string
      conclusion:
        description: Conclusion the calling run's jobs reached
        required: true
        type: string
    secrets:
      RESEND_API_KEY:
        required: false

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

jobs:
  digest:
    name: Send run digest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Inside a call, `github.event` is the caller's own event, so every value about the
    # run comes from the inputs.
    concurrency:
      group: autorelease-email-${{ inputs.run_id }}
      cancel-in-progress: false
    env:
      EMAIL_FROM: ${{ vars.AUTORELEASE_EMAIL_FROM }}
      EMAIL_TO: ${{ vars.AUTORELEASE_EMAIL_TO }}
      CALLED_WORKFLOW: ${{ inputs.workflow }}
      RUN_ID: ${{ inputs.run_id }}
      RUN_ATTEMPT: ${{ inputs.run_attempt }}
      RUN_URL: ${{ format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, inputs.run_id) }}
      RUN_CONCLUSION: ${{ inputs.conclusion }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Decide whether delivery is configured
        id: gate
        # An unconfigured repository skips quietly instead of failing, so the
        # digest can merge ahead of the Resend secret and variables existing.
        # The secret is only in this step and the send step, never in the job.
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          if [[ -n "$RESEND_API_KEY" && -n "$EMAIL_FROM" && -n "$EMAIL_TO" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "RESEND_API_KEY, AUTORELEASE_EMAIL_FROM, or AUTORELEASE_EMAIL_TO is unset; no digest is sent."
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.gate.outputs.configured == 'true'
        with:
          persist-credentials: false
      - name: Download the retained run state
        id: state
        if: steps.gate.outputs.configured == 'true'
        run: |
          mkdir -p email-run/state
          [[ "$RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          case "$CALLED_WORKFLOW" in
            watcher)
              echo "workflow=watcher" >> "$GITHUB_OUTPUT"
              artifacts=("autorelease-investigation-$RUN_ID")
              ;;
            publish)
              echo "workflow=publish" >> "$GITHUB_OUTPUT"
              # Each attempt retains its own state, and a rerun of only the failed
              # jobs keeps the state an earlier attempt retained, so the newest
              # attempt that retained one describes the run.
              artifacts=()
              for ((attempt = RUN_ATTEMPT; attempt > 0; attempt--)); do
                artifacts+=("release-transaction-state-$RUN_ID-$attempt")
              done
              ;;
            *)
              echo "unrouted calling workflow: $CALLED_WORKFLOW" >&2
              exit 1
              ;;
          esac
          # A run that crashed before retaining its state has no artifact; the
          # renderer then only accepts that absence for the failure templates.
          for artifact in "${artifacts[@]}"; do
            if gh run download "$RUN_ID" --repo "${{ github.repository }}" \
              --name "$artifact" --dir email-run/state; then
              break
            fi
            echo "No retained state artifact exists for $artifact."
          done
      - name: Render the deterministic digest
        if: steps.gate.outputs.configured == 'true'
        run: |
          ./autorelease/control.py email-digest \
            --workflow "${{ steps.state.outputs.workflow }}" \
            --conclusion "$RUN_CONCLUSION" \
            --run-url "$RUN_URL" \
            --repository "${{ github.repository }}" \
            --decision email-run/state/watch-decision.json \
            --plan email-run/state/autorelease-plan.json \
            --transaction email-run/state/transaction-state.json \
            --status email-run/state/status/status.json \
            > email-run/digest.json
          # The rendered digest is logged so the template that was sent can be read
          # back from the run; it carries no secret and no value that was not validated.
          jq -r '"Subject: " + .subject, "", .body' email-run/digest.json
          echo "template=$(jq -r .template email-run/digest.json)"
      - name: Send the digest through Resend
        if: steps.gate.outputs.configured == 'true'
        # The secret reaches exactly one place: the Authorization header.
        # Transient failures are retried under one idempotency key per run attempt, so
        # a retry after a lost reply cannot send the digest twice. A delivery that still
        # fails fails this job, and with it the run: the digest is the report, so a red
        # run is the only one left when the channel is down, and rerunning the failed
        # jobs of a publish run whose other jobs passed repeats only this one.
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          WORKFLOW: ${{ steps.state.outputs.workflow }}
        run: |
          jq \
            --arg from "$EMAIL_FROM" \
            --arg to "$EMAIL_TO" \
            '{from: $from, to: [$to], subject: .subject, text: .body}' \
            email-run/digest.json > email-run/payload.json
          curl --fail-with-body --silent --show-error \
            --connect-timeout 10 --max-time 30 \
            --retry 3 --retry-delay 15 --retry-connrefused \
            --request POST https://api.resend.com/emails \
            --header "Idempotency-Key: php-bin-$WORKFLOW-$RUN_ID-$RUN_ATTEMPT" \
            --header "Authorization: Bearer $RESEND_API_KEY" \
            --header "Content-Type: application/json" \
            --data @email-run/payload.json
