name: Maintenance end to end

on:
  workflow_dispatch:
    inputs:
      php_bin_sha:
        description: Exact reviewed php-bin commit
        required: true
        type: string
      mise_php_sha:
        description: Exact reviewed mise-php commit
        required: true
        type: string
      suite:
        description: Verification suite
        required: true
        default: production-parity
        type: choice
        options: [production-parity, agent-canary, notification-canary, live-canary]
      live_version:
        description: Exact stable PHP version for live-canary
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: maintenance-e2e-${{ inputs.suite }}
  cancel-in-progress: false

jobs:
  production-parity:
    if: inputs.suite == 'production-parity'
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout reviewed workflow definition
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: control
          persist-credentials: false
      - name: Reject unreviewed workflow bytes
        working-directory: control
        run: |
          # This reviewed pin detects workflow edits that omit the corresponding pin update.
          expected="$(jq -r '.workflows[".github/workflows/maintenance-e2e.yml"]' .github/maintenance-pins.json)"
          actual="sha256:$(shasum -a 256 .github/workflows/maintenance-e2e.yml | awk '{print $1}')"
          test "$actual" = "$expected"
      - name: Checkout exact php-bin commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: bigpixelrocket/php-bin
          ref: ${{ inputs.php_bin_sha }}
          path: php-bin
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout exact mise-php commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: bigpixelrocket/mise-php
          ref: ${{ inputs.mise_php_sha }}
          path: mise-php
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4
        with:
          version: 2026.7.13
          sha256: ef747f4bd944d7cb4efe1832ec6cd29dfdbc217389122fa37c20d116d90c1eb6
          install: false
      - name: Probe production credential boundaries
        run: |
          test -z "${OPENAI_API_KEY:-}"
          test -z "${GH_TOKEN:-}"
          test -z "${GITHUB_TOKEN:-}"
      - name: Run stable cross-repository verifier
        run: |
          ./php-bin/scripts/verify-maintenance-system \
            --mise-repo ./mise-php \
            --php-bin-sha "${{ inputs.php_bin_sha }}" \
            --mise-php-sha "${{ inputs.mise_php_sha }}" \
            --output ./verification-results
      - name: Retain production-parity report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: maintenance-production-parity-${{ github.run_id }}
          path: verification-results/
          if-no-files-found: error
          retention-days: 90
          include-hidden-files: true

  agent-canary:
    if: inputs.suite == 'agent-canary'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: php-maintenance-agent-canary
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.php_bin_sha }}
          persist-credentials: false
      - name: Bind the credentialed canary to reviewed main
        env:
          EXPECTED_SHA: ${{ inputs.php_bin_sha }}
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Prepare deterministic canary contract
        run: |
          mkdir -p canary "$RUNNER_TEMP/codex-home"
          cp .codex/investigation.config.toml "$RUNNER_TEMP/codex-home/config.toml"
          jq -nr --arg nonce "$GITHUB_RUN_ID" \
            '"Return only this JSON object with both values as strings: {\"status\":\"passed\",\"nonce\":\"" + $nonce + "\"}. Do not use tools and do not modify files."' \
            > canary/prompt.md
          jq -n --arg nonce "$GITHUB_RUN_ID" \
            '{
              "$schema":"https://json-schema.org/draft/2020-12/schema",
              type:"object",
              additionalProperties:false,
              required:["status","nonce"],
              properties:{status:{const:"passed"},nonce:{const:$nonce}}
            }' > canary/schema.json
      - name: Run read-only Codex action canary
        uses: openai/codex-action@52fe01ec70a42f454c9d2ebd47598f9fd6893d56 # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          codex-version: 0.145.0
          prompt-file: canary/prompt.md
          output-file: canary/result.json
          output-schema-file: canary/schema.json
          codex-home: ${{ runner.temp }}/codex-home
          sandbox: read-only
          safety-strategy: drop-sudo
          allow-users: loadinglucian
          allow-bots: false
          allow-bot-users: github-actions[bot]
          codex-args: '["--strict-config","--ephemeral"]'
      - name: Verify exact canary result
        run: |
          jq -e --arg nonce "$GITHUB_RUN_ID" \
            '.status == "passed" and .nonce == $nonce and (keys == ["nonce","status"])' \
            canary/result.json
      - name: Retain Codex action canary evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: maintenance-agent-canary-${{ github.run_id }}
          path: canary/
          if-no-files-found: error
          retention-days: 90

  notification-canary:
    if: inputs.suite == 'notification-canary'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.php_bin_sha }}
          persist-credentials: false
      - name: Create, replay, transition, and close one namespaced issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p canary
          action_key="notification-canary:${{ github.run_id }}"
          jq -n --arg actionKey "$action_key" \
            '{actionKey:$actionKey,state:"detected",severity:"info",summary:"Harmless notification delivery canary."}' \
            > canary/event.json
          ./scripts/notify-maintenance --event canary/event.json --state canary/state.json --output canary/next.json \
            --backend github --repo "${{ github.repository }}" --owner "${{ vars.MAINTENANCE_OWNER }}"
          mv canary/next.json canary/state.json
          ./scripts/notify-maintenance --event canary/event.json --state canary/state.json --output canary/replay.json \
            --backend github --repo "${{ github.repository }}" --owner "${{ vars.MAINTENANCE_OWNER }}"
          test "$(jq -r .lastAction canary/replay.json)" = "none"
          jq '.state="php_bin_ready"' canary/event.json > canary/transition.json
          ./scripts/notify-maintenance --event canary/transition.json --state canary/state.json --output canary/next.json \
            --backend github --repo "${{ github.repository }}" --owner "${{ vars.MAINTENANCE_OWNER }}"
          mv canary/next.json canary/state.json
          jq '.state="complete" | .finalResult="passed"' canary/event.json > canary/complete.json
          ./scripts/notify-maintenance --event canary/complete.json --state canary/state.json --output canary/closed.json \
            --backend github --repo "${{ github.repository }}" --owner "${{ vars.MAINTENANCE_OWNER }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: maintenance-notification-canary-${{ github.run_id }}
          path: canary/
          if-no-files-found: error
          retention-days: 90

  live-canary:
    if: inputs.suite == 'live-canary'
    runs-on: macos-26
    timeout-minutes: 20
    environment: php-maintenance-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: bigpixelrocket/mise-php
          ref: ${{ inputs.mise_php_sha }}
          persist-credentials: false
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4
      - name: Verify exact and branch-shorthand public installs
        env:
          LIVE_VERSION: ${{ inputs.live_version }}
        run: |
          [[ "$LIVE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[1-9][0-9]*)?$ ]]
          branch="$LIVE_VERSION"
          branch="${branch%%-*}"
          branch="${branch%.*}"
          mise plugin link php "$GITHUB_WORKSPACE"
          mise install "php@$LIVE_VERSION"
          mise install "php@$branch"
          mise exec "php@$LIVE_VERSION" -- php -v
          mise exec "php@$branch" -- php -v
